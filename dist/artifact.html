<title>Открытка Чарос</title>
<meta name="description" content="Поздравительная открытка с подарком, тортом и списком пожеланий.">
<meta name="theme-color" content="#17171d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ токены ============ */
:root {
  --bg: #fff6ec;
  --accent: #ff3d8b;
  --warm: #ffb020;
  --glow: #7b5cff;
  --text: #2a2140;
  --muted: rgba(42, 33, 64, 0.62);
  --line: rgba(42, 33, 64, 0.16);
  --panel: #ffffff;
  --ink-soft: rgba(42, 33, 64, 0.06);
  --script: 'Caveat', 'Segoe Script', cursive;
  --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 18px 44px rgba(42, 33, 64, 0.14);
}

* { box-sizing: border-box; }

/* Собственные display у кнопок и слайдов перебивают правило браузера для [hidden]. */
[hidden] { display: none !important; }

html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

/* тёплые пятна света по углам */
body::before {
  content: '';
  position: fixed;
  inset: -25vmax;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(34vmax 34vmax at 16% 20%, color-mix(in srgb, var(--glow) 16%, transparent), transparent 70%),
    radial-gradient(40vmax 40vmax at 86% 78%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 72%),
    radial-gradient(30vmax 30vmax at 72% 10%, color-mix(in srgb, var(--warm) 20%, transparent), transparent 70%);
  filter: blur(26px);
  animation: drift 26s ease-in-out infinite alternate;
}

@keyframes drift {
  from { transform: translate3d(-2%, -1%, 0) scale(1); }
  to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
}

#confetti {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ============ человечки на фоне ============ */
.doodles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.doodle {
  position: absolute;
  width: 150px;
  height: auto;
  aspect-ratio: 254 / 252;
  opacity: 0.5;
  animation: bob 5s ease-in-out infinite;
}

@keyframes bob {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -10px; }
}

/* штрихи фигур */
.d-fill    { fill: #fff; stroke: var(--text); stroke-width: 5; stroke-linejoin: round; }
.d-line    { fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round; }
.d-thin    { fill: none; stroke: var(--text); stroke-width: 4; stroke-linecap: round; }
.d-dot     { fill: var(--text); }
.d-star    { fill: var(--warm); stroke: var(--text); stroke-width: 4; stroke-linejoin: round; }
.d-flame   { fill: var(--warm); stroke: var(--text); stroke-width: 3.5; }
.d-balloon { fill: #8fb8f0; stroke: var(--text); stroke-width: 5; }
.d-heart   { fill: #ff4d6d; }
.s1 { fill: #ff6ea9; } .s2 { fill: #ffd23f; } .s3 { fill: #5ad1a5; } .s4 { fill: #7cc0ff; }

/* Раскладка: фигуры стоят по краям, чтобы не лезть в текст. */
.d1 { left: 1%;   bottom: 4%;  width: 168px; animation-delay: -0.4s; rotate: -3deg; }
.d2 { right: 2%;  top: 9%;     width: 152px; animation-delay: -1.6s; rotate: 4deg; }
.d3 { right: 3%;  bottom: 5%;  width: 176px; animation-delay: -2.6s; rotate: 2deg; }
.d4 { left: 4%;   top: 7%;     width: 150px; animation-delay: -3.4s; rotate: -5deg; }
.d5 { left: 19%;  bottom: 1%;  width: 118px; animation-delay: -2s;   rotate: 3deg; opacity: 0.3; }
.d6 { right: 20%; top: 1%;     width: 112px; animation-delay: -1s;   rotate: -3deg; opacity: 0.3; }

@media (max-width: 1100px) {
  .d5, .d6 { display: none; }
  .doodle { width: 130px; opacity: 0.42; }
  .d3 { width: 142px; }
}

@media (max-width: 720px) {
  .d1 { left: -6%;  bottom: 2%; width: 116px; }
  .d2 { right: -6%; top: 5%;    width: 108px; }
  .d3 { display: none; }
  .d4 { left: -7%;  top: 3%;    width: 104px; opacity: 0.28; }
  .doodle { opacity: 0.34; }
}

/* ============ общие элементы ============ */
.screen {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: calc(84px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-left)) calc(48px + env(safe-area-inset-bottom));
  text-align: center;
}


.eyebrow {
  margin: 0;
  font-size: clamp(11px, 3vw, 13px);
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
}
.eyebrow.gold { color: var(--warm); }
.eyebrow.pink { color: var(--accent); }
.eyebrow.dim  { color: var(--muted); letter-spacing: 0.4em; }

.gradient-text {
  background: linear-gradient(100deg, var(--accent), var(--warm) 45%, var(--accent) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.script-name {
  font-family: var(--script);
  font-weight: 700;
  font-size: clamp(52px, 14vw, 116px);
  line-height: 1.32;
  padding: 0 0.08em 0.06em;
  margin: 0;
  text-wrap: balance;
}

.script-line {
  font-family: var(--script);
  font-size: clamp(34px, 9vw, 60px);
  line-height: 1.3;
  padding-bottom: 0.06em;
  margin: 0;
  color: var(--text);
}

.hint {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 30px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(100deg, var(--accent), var(--warm));
  box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 38%, transparent);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px color-mix(in srgb, var(--accent) 46%, transparent); }
.btn:active { transform: translateY(0); }

.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(42, 33, 64, 0.1);
}
.ghost-btn:hover { background: #fff; transform: translateY(-1px); }

:where(button, a, [tabindex]):focus-visible {
  outline: 2px solid var(--warm);
  outline-offset: 3px;
}

.back-btn {
  position: fixed;
  left: calc(16px + env(safe-area-inset-left));
  top: calc(16px + env(safe-area-inset-top));
  z-index: 30;
}

/* ============ 1. подарочная коробка ============ */
/* Настоящая 3D-модель на CSS-трансформациях: коробка из граней плюс объёмная крышка.
   Все размеры в em, а масштаб задаёт font-size сцены — так коробка тянется под экран. */
.gift-stage {
  font-size: clamp(1px, 0.3vw, 1.6px);
  width: 240em;
  height: 214em;
  perspective: 2200em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.gift-tilt,
.gift-sway,
.gift-body,
.gift-lid {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-style: preserve-3d;
}

.gift-tilt {
  width: 0;
  height: 0;
  transform: rotateX(-20deg);
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.gift-sway {
  width: 0;
  height: 0;
  animation: sway 7s ease-in-out infinite alternate, hover 3.6s ease-in-out infinite;
}

@keyframes sway {
  from { rotate: y 9deg; }
  to   { rotate: y 41deg; }
}
@keyframes hover {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -10em; }
}

.gface {
  position: absolute;
  left: 50%;
  top: 50%;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.65) 1.4px, transparent 1.8px),
    linear-gradient(155deg,
      color-mix(in srgb, var(--accent) 92%, #fff),
      var(--accent) 55%,
      color-mix(in srgb, var(--accent) 78%, var(--glow)));
  background-size: 26em 26em, auto;
  backface-visibility: hidden;
}

/* Лента: вертикальная полоса на каждой боковой грани. */
.gift-body .gface::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 17%;
  translate: -50% 0;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--warm) 78%, #c06a00),
    var(--warm) 42%, #fff0c2 50%, var(--warm) 58%,
    color-mix(in srgb, var(--warm) 78%, #c06a00));
}

/* корпус: 200 x 130, глубина 160 */
.gf { width: 200em; height: 130em; transform: translate(-50%, -50%) translateZ(80em); }
.gb { width: 200em; height: 130em; transform: translate(-50%, -50%) rotateY(180deg) translateZ(80em); }
.gr { width: 160em; height: 130em; transform: translate(-50%, -50%) rotateY(90deg) translateZ(100em); }
.gl { width: 160em; height: 130em; transform: translate(-50%, -50%) rotateY(-90deg) translateZ(100em); }
.gr, .lr { filter: brightness(0.84) saturate(1.05); }
.gl, .ll { filter: brightness(0.94); }
.gb, .lb { filter: brightness(0.78); }

/* крышка: 214 x 36, глубина 174, поднята над корпусом */
.gift-lid {
  width: 0;
  height: 0;
  transform: translateY(-80em);
  transition: transform 0.75s cubic-bezier(0.5, -0.4, 0.4, 1.4), opacity 0.6s ease;
}

.lt {
  width: 206em;
  height: 166em;
  transform-style: preserve-3d;
  backface-visibility: visible;
  transform: translate(-50%, -50%) rotateX(90deg) translateZ(18em);
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.7) 1.4px, transparent 1.8px),
    linear-gradient(150deg,
      color-mix(in srgb, var(--accent) 84%, #fff),
      var(--accent) 60%,
      color-mix(in srgb, var(--accent) 82%, var(--glow)));
}
.lf { width: 206em; height: 36em; transform: translate(-50%, -50%) translateZ(83em); }
.lb { width: 206em; height: 36em; transform: translate(-50%, -50%) rotateY(180deg) translateZ(83em); }
.lr { width: 166em; height: 36em; transform: translate(-50%, -50%) rotateY(90deg) translateZ(103em); }
.ll { width: 166em; height: 36em; transform: translate(-50%, -50%) rotateY(-90deg) translateZ(103em); }

/* лента на крышке идёт крестом */
.gift-lid .lf::before,
.gift-lid .lb::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 17%;
  translate: -50% 0;
  background: var(--warm);
}
.gift-lid .lr::before,
.gift-lid .ll::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 21%;
  translate: -50% 0;
  background: var(--warm);
}
.lt::before,
.lt::after {
  content: '';
  position: absolute;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--warm) 78%, #c06a00),
    var(--warm) 42%, #fff0c2 50%, var(--warm) 58%,
    color-mix(in srgb, var(--warm) 78%, #c06a00));
}
.lt::before { left: 50%; top: 0; bottom: 0; width: 17%; translate: -50% 0; }
.lt::after  { top: 50%; left: 0; right: 0; height: 21%; translate: 0 -50%;
              background: linear-gradient(180deg,
                color-mix(in srgb, var(--warm) 78%, #c06a00),
                var(--warm) 42%, #fff0c2 50%, var(--warm) 58%,
                color-mix(in srgb, var(--warm) 78%, #c06a00)); }

/* Бант стоит на крышке: он живёт в системе координат самой крышки, а не её грани. */
.gift-lid .bow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 124em;
  height: auto;
  overflow: visible;
  translate: -50% -50%;
  transform: translateY(-50em);
  filter: drop-shadow(0 4em 8em rgba(42, 33, 64, 0.3));
}
.bow-loop { fill: url(#bowFill); }
.bow-tail { fill: color-mix(in srgb, var(--warm) 72%, #b35c00); }
.bow-knot { fill: url(#bowFill); }

/* мягкая тень под коробкой, лежит на «полу» */
.gift-shadow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 230em;
  height: 170em;
  transform: translate(-50%, -50%) rotateX(90deg) translateZ(-72em);
  background: radial-gradient(closest-side, rgba(42, 33, 64, 0.24), transparent);
  filter: blur(6em);
}

.gift-stage:hover .gift-tilt { transform: rotateX(-26deg); }

/* открытие: крышка взлетает и уходит, коробка растворяется */
.gift-stage.is-opening .gift-lid {
  transform: translateY(-260em) rotateZ(24deg) rotateX(30deg);
  opacity: 0;
}
.gift-stage.is-opening .gift-sway { animation: none; }
.gift-stage.is-opening {
  transition: opacity 0.5s ease 0.25s, scale 0.6s ease 0.2s;
  opacity: 0;
  scale: 1.25;
}

/* ============ 2. слайды ============ */
.screen-deck { justify-content: flex-start; padding-top: 76px; }

.dots {
  position: fixed;
  left: 50%;
  top: calc(22px + env(safe-area-inset-top));
  translate: -50% 0;
  z-index: 30;
  display: flex;
  gap: 12px;
}
.dots button {
  position: relative;
  width: 13px;
  height: 13px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--ink-soft);
  cursor: pointer;
  transition: background 0.3s, box-shadow 0.3s;
}
/* Точки маленькие — расширяем область нажатия до пальца, не трогая вид. */
.dots button::after {
  content: '';
  position: absolute;
  inset: -14px -8px;
}
.dots button.is-active {
  background: color-mix(in srgb, var(--accent) 60%, #fff);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}

.slides {
  width: 100%;
  max-width: 700px;
  margin: auto;
}

.slide { display: none; }
.slide.is-active {
  display: block;
  animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}

.nav-btn {
  position: fixed;
  top: 50%;
  translate: 0 -50%;
  z-index: 30;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(42, 33, 64, 0.12);
}
.nav-btn[data-dir="prev"] { left: calc(18px + env(safe-area-inset-left)); }
.nav-btn[data-dir="next"] { right: calc(18px + env(safe-area-inset-right)); }
.nav-btn:disabled { opacity: 0.25; cursor: default; }

/* — слайд 1: открытка — */
.card-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 3vw, 26px);
}
.card-name-row .party { font-size: clamp(30px, 8vw, 58px); line-height: 1; }
.card-name-row .party.right { scale: -1 1; }

.card-glow {
  position: absolute;
  left: 50%;
  top: 26%;
  translate: -50% -50%;
  width: min(560px, 88vw);
  aspect-ratio: 2 / 1;
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--warm) 30%, transparent), transparent);
  filter: blur(10px);
  pointer-events: none;
  z-index: -1;
}

.card-date { margin: 18px 0 0; color: var(--muted); font-size: 16px; }
.card-signoff { margin: 18px 0 0; color: var(--muted); font-size: 16px; }
.card-actions { margin-top: 30px; }

/* — слайд 2: письмо с пожеланиями — */
/* ---- торт: цилиндр из панелей, который можно крутить ---- */
.cake3d {
  font-size: clamp(0.85px, 0.2vw, 1.3px);
  width: 300em;
  height: 250em;
  margin: 0 auto;
  perspective: 1000em;
  cursor: grab;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  /* без этого перетаскивание выделяет надпись на торте */
  user-select: none;
  -webkit-user-select: none;
}
.cake3d:active { cursor: grabbing; }

.cake-orbit {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
  transform: rotateX(-38deg);
}

.cake-orbit > * {
  position: absolute;
  left: 0;
  top: 0;
}

/* бок торта */
.c-panel {
  width: 22em;
  height: 76em;
  background: linear-gradient(180deg, #8b5a35, #6d4227 55%, #55321d);
}

/* крем стекает сверху по каждой панели */
.c-drip {
  position: absolute;
  left: -0.5em;
  right: -0.5em;
  top: -6em;
  display: block;
  border-radius: 0 0 6em 6em;
  background: linear-gradient(180deg, #fffaf0, #f4e3c8);
}

.c-top {
  width: 192em;
  height: 192em;
  overflow: hidden;
  border-radius: 50%;
  background:
    radial-gradient(circle at 38% 32%, #fffdf6, #f6e6cb 62%, #e6d0ae);
  box-shadow: inset 0 0 26em rgba(120, 80, 40, 0.22);
}

/* Тень живёт вне 3D-сцены: горизонтальную «тарелку» браузер путал с боками торта. */
.cake-shadow {
  position: absolute;
  left: 50%;
  top: 74%;
  width: 250em;
  height: 60em;
  translate: -50% -50%;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(42, 33, 64, 0.22), transparent);
  filter: blur(4em);
}

.c-candle {
  width: 6em;
  height: 54em;
  background: linear-gradient(180deg, #ff9dc4, var(--accent));
}

.c-flame {
  width: 16em;
  height: 24em;
  border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 68%, #fffbe0, #ffc23d 55%, rgba(255, 106, 0, 0.1));
  box-shadow: 0 0 22em rgba(255, 176, 32, 0.75);
  animation: flicker 1.5s ease-in-out infinite;
}

@keyframes flicker {
  0%, 100% { scale: 1 1; opacity: 1; }
  40%      { scale: 0.92 1.08; opacity: 0.9; }
  70%      { scale: 1.06 0.95; opacity: 1; }
}

/* имя, выведенное «кремом» на боку */
/* Имя лежит на кремовой крышке: сама крышка развёрнута лицом вверх,
   поэтому текст на ней читается, а не зеркалится. */
.c-name {
  position: absolute;
  left: 50%;
  top: 62%;
  translate: -50% -50%;
  font-family: var(--script);
  font-weight: 700;
  font-size: 40em;
  line-height: 1;
  white-space: pre;
  color: var(--accent);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
}

.cake-hint {
  margin: 6px 0 0;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  transition: opacity 0.4s ease;
}
.cake-hint.is-hidden { opacity: 0; }

.letter-title {
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(28px, 7vw, 46px);
  margin: 22px 0 0;
  min-height: 1.2em;
}
.caret {
  display: inline-block;
  width: 3px;
  height: 0.9em;
  translate: 0 0.1em;
  background: var(--accent);
  animation: blink 1s steps(2) infinite;
}
.caret.is-done { display: none; }
@keyframes blink { 50% { opacity: 0; } }

.letter-body {
  margin: 26px auto 0;
  max-width: 620px;
  text-align: left;
  padding: clamp(20px, 5vw, 30px);
  border-radius: 22px;
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: var(--shadow);
}

.letter-intro { margin: 0 0 20px; font-size: 17px; line-height: 1.65; color: var(--muted); }

/* base64url <-> UTF-8, чтобы открытка целиком помещалась в ссылку. */
function encodeCard(data) {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeCard(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
}

/* Открытка живёт в хэше: index.html#<base64url>.
   В однофайловой сборке перед данными стоит маркер "make:" — его снимаем. */
function readCardFromLocation() {
  let raw = location.hash.replace(/^#/, '');
  if (raw === 'make') raw = '';
  else if (raw.startsWith('make:')) raw = raw.slice(5);
  if (!raw) return null;
  try {
    return Object.assign({}, DEFAULT_CARD, decodeCard(raw));
  } catch (e) {
    console.warn('Не удалось разобрать ссылку открытки:', e);
    return null;
  }
}

function applyTheme(card) {
  const theme = THEMES[card.theme] || THEMES.party;
  const root = document.documentElement;
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--warm', theme.warm);
  root.style.setProperty('--glow', theme.glow);
}

/* Ссылка на музыку -> embed. Поддержаны YouTube, Spotify и прямые mp3. */
function musicSource(url) {
  if (!url) return null;
  const u = url.trim();
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if (m) {
    const t = (u.match(/[?&]t=(\d+)/) || [])[1];
    return {
      kind: 'iframe',
      src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&loop=1&playlist=${m[1]}` + (t ? `&start=${t}` : '')
    };
  }
  m = u.match(/spotify\.com\/(?:intl-\w+\/)?(track|album|playlist)\/([\w]+)/);
  if (m) return { kind: 'iframe', src: `https://open.spotify.com/embed/${m[1]}/${m[2]}?autoplay=1` };
  if (/\.(mp3|ogg|wav|m4a)(\?.*)?$/i.test(u)) return { kind: 'audio', src: u };
  return { kind: 'iframe', src: u };
}

}

и база данных не нужны, никто ничего не хранит.\n  </p>\n\n  <form id=\"form\" autocomplete=\"off\">\n    <div class=\"row-2\">\n      <div class=\"field\">\n        <label for=\"to\">Кому</label>\n        <input id=\"to\" placeholder=\"Например: Чарос\">\n      </div>\n      <div class=\"field\">\n        <label for=\"from\">От кого</label>\n        <input id=\"from\" placeholder=\"Например: Фирдавс\">\n      </div>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"date\">Дата</label>\n      <input id=\"date\" placeholder=\"18 августа\">\n    </div>\n\n    <div class=\"field\">\n      <label for=\"signoff\">Подпись перед именем</label>\n      <input id=\"signoff\" placeholder=\"С теплом,\">\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterTitle\">Заголовок письма</label>\n      <input id=\"letterTitle\" placeholder=\"С днём рождения!\">\n      <p class=\"hint\">Печатается по буквам на слайде с тортом.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterIntro\">Вступление письма</label>\n      <textarea id=\"letterIntro\" style=\"min-height:80px\"></textarea>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"wishes\">Пожелания</label>\n      <textarea id=\"wishes\" style=\"min-height:220px\"></textarea>\n      <p class=\"hint\">По одному пожеланию в строке — они появятся пронумерованным списком.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterClosing\">Концовка письма</label>\n      <textarea id=\"letterClosing\" style=\"min-height:80px\"></textarea>\n    </div>\n\n    <div class=\"row-2\">\n      <div class=\"field\">\n        <label for=\"finaleTitle\">Последний слайд: заголовок</label>\n        <input id=\"finaleTitle\">\n      </div>\n      <div class=\"field\">\n        <label for=\"finaleText\">Последний слайд: текст</label>\n        <input id=\"finaleText\">\n      </div>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"photoUrls\">Фотографии по ссылкам</label>\n      <textarea id=\"photoUrls\" style=\"min-height:90px\"\n                placeholder=\"https://…/photo1.jpg&#10;https://…/photo2.jpg\"></textarea>\n      <p class=\"hint\">По одной ссылке в строке. Есть фото — появится отдельный слайд.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"photoFiles\">Или прикрепить фото с устройства</label>\n      <input id=\"photoFiles\" type=\"file\" accept=\"image/*\" multiple>\n      <p class=\"hint\" id=\"photoStatus\">\n        Фото сжимаются и вшиваются прямо в ссылку. Больше 2–3 снимков — и ссылка станет очень длинной.\n      </p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"music\">Музыка</label>\n      <input id=\"music\" placeholder=\"Ссылка на YouTube, Spotify или .mp3\">\n      <p class=\"hint\">Включится, как только получатель откроет подарок.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"theme\">Тема</label>\n      <select id=\"theme\"></select>\n    </div>\n\n    <div class=\"btn-row\">\n      <button type=\"submit\" class=\"btn\">Создать ссылку</button>\n      <button type=\"button\" class=\"ghost-btn\" id=\"previewBtn\">Предпросмотр</button>\n    </div>\n  </form>\n\n  <div class=\"result\" id=\"result\">\n    <div class=\"field\" style=\"margin-top:24px\">\n      <label for=\"resultLink\">Ссылка на открытку</label>\n      <textarea class=\"result-link\" id=\"resultLink\" rows=\"4\" readonly></textarea>\n    </div>\n    <div class=\"btn-row\">\n      <button type=\"button\" class=\"btn\" id=\"copyBtn\">Скопировать</button>\n      <a class=\"ghost-btn\" id=\"openBtn\" target=\"_blank\" rel=\"noopener\">Открыть открытку</a>\n      <a class=\"ghost-btn\" id=\"waBtn\" target=\"_blank\" rel=\"noopener\">Отправить в WhatsApp</a>\n    </div>\n    <p class=\"hint\" id=\"sizeHint\" style=\"margin-top:14px;color:rgba(246,244,248,.6);font-size:12.5px\"></p>\n  </div>\n</main>\n\n<div class=\"toast\" id=\"toast\"></div>"};
const SCRIPTS = {"card": "/* Открытка: подарок → заставка → слайды (открытка, пожелания, фото, финал). */\n(function () {\n  const card = readCardFromLocation() || Object.assign({}, DEFAULT_CARD);\n  applyTheme(card);\n\n  const $ = (id) => document.getElementById(id);\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  /* ---------- тексты ---------- */\n  document.title = card.to ? `С днём рождения, ${card.to}! 🎉` : 'С днём рождения!';\n\n  $('giftTo').textContent = card.to || 'Тебе';\n  $('cardName').textContent = card.to || '';\n  $('cardDate').textContent = card.date || '';\n  $('cardDate').hidden = !card.date;\n  $('cardSignoff').textContent = card.signoff || '';\n  $('cardFrom').textContent = card.from || '';\n  $('letterSign').textContent = card.from ? `— ${card.from}` : '';\n  $('finaleTitle').textContent = card.finaleTitle || '';\n  $('finaleText').textContent = card.finaleText || '';\n\n  /* ---------- конфетти ---------- */\n  const confetti = $('confetti');\n  const cctx = confetti.getContext('2d');\n  let pieces = [];\n\n  function sizeCanvas(el, context) {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    el.width = innerWidth * dpr;\n    el.height = innerHeight * dpr;\n    el.style.width = innerWidth + 'px';\n    el.style.height = innerHeight + 'px';\n    context.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n\n  function makePiece(fromTop) {\n    return {\n      x: Math.random() * innerWidth,\n      y: fromTop ? -20 - Math.random() * innerHeight : Math.random() * innerHeight,\n      w: 4 + Math.random() * 6,\n      h: 7 + Math.random() * 9,\n      speed: 18 + Math.random() * 40,\n      sway: 12 + Math.random() * 26,\n      phase: Math.random() * Math.PI * 2,\n      spin: (Math.random() - 0.5) * 3,\n      angle: Math.random() * Math.PI,\n      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],\n      alpha: 0.35 + Math.random() * 0.45\n    };\n  }\n\n  function resetConfetti() {\n    pieces = Array.from({ length: innerWidth < 600 ? 34 : 60 }, () => makePiece(false));\n  }\n\n  /* ---------- пасхалка: тап по фону рассыпает фонтан ---------- */\n  let tapBits = [];\n\n  function spawnBurst(x, y) {\n    if (reduced || tapBits.length > 90) return;\n    const count = 14;\n    for (let i = 0; i < count; i++) {\n      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;\n      const speed = 220 + Math.random() * 320;\n      tapBits.push({\n        x, y,\n        vx: Math.cos(angle) * speed,\n        vy: Math.sin(angle) * speed,\n        size: 20 + Math.random() * 20,\n        angle: (Math.random() - 0.5) * 0.8,\n        spin: (Math.random() - 0.5) * 6,\n        life: 1,\n        char: BURST_EMOJI[(Math.random() * BURST_EMOJI.length) | 0]\n      });\n    }\n  }\n\n  function drawBurst(dt) {\n    tapBits = tapBits.filter((p) => p.life > 0 && p.y < innerHeight + 80);\n    tapBits.forEach((p) => {\n      p.life -= dt * 0.42;\n      p.vy += 780 * dt;\n      p.x += p.vx * dt;\n      p.y += p.vy * dt;\n      p.angle += p.spin * dt;\n      cctx.save();\n      cctx.translate(p.x, p.y);\n      cctx.rotate(p.angle);\n      cctx.globalAlpha = Math.min(1, Math.max(p.life, 0) * 1.6);\n      cctx.font = `${p.size}px serif`;\n      cctx.textAlign = 'center';\n      cctx.textBaseline = 'middle';\n      cctx.fillText(p.char, 0, 0);\n      cctx.restore();\n    });\n    cctx.globalAlpha = 1;\n  }\n\n  /* Кнопки и ссылки не трогаем — там свои действия. */\n  addEventListener('pointerdown', (e) => {\n    if (e.target.closest('button, a, input, textarea, select')) return;\n    spawnBurst(e.clientX, e.clientY);\n  });\n\n  /* ---------- общий цикл анимации ---------- */\n  let last = performance.now();\n  function tick(now) {\n    const dt = Math.min((now - last) / 1000, 0.05);\n    last = now;\n\n    cctx.clearRect(0, 0, innerWidth, innerHeight);\n    pieces.forEach((p, i) => {\n      p.y += p.speed * dt;\n      p.phase += dt;\n      p.angle += p.spin * dt;\n      const x = p.x + Math.sin(p.phase) * p.sway;\n      cctx.save();\n      cctx.translate(x, p.y);\n      cctx.rotate(p.angle);\n      cctx.globalAlpha = p.alpha;\n      cctx.fillStyle = p.color;\n      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);\n      cctx.restore();\n      if (p.y > innerHeight + 30) pieces[i] = makePiece(true);\n    });\n    cctx.globalAlpha = 1;\n    if (tapBits.length) drawBurst(dt);\n    requestAnimationFrame(tick);\n  }\n\n  function resizeAll() {\n    sizeCanvas(confetti, cctx);\n    resetConfetti();\n  }\n\n  resizeAll();\n  addEventListener('resize', resizeAll);\n  if (!reduced) requestAnimationFrame(tick);\n\n  /* ---------- музыка ---------- */\n  const source = musicSource(card.music);\n  const toggle = $('musicToggle');\n  let playing = false;\n\n  function startMusic() {\n    if (!source || playing) return;\n    playing = true;\n    toggle.classList.add('is-on', 'is-playing');\n    if (source.kind === 'audio') {\n      const audio = $('musicAudio');\n      audio.src = source.src;\n      audio.volume = 0.6;\n      audio.play().catch(() => { playing = false; toggle.classList.remove('is-playing'); });\n    } else {\n      const frame = $('musicFrame');\n      frame.hidden = false;\n      frame.src = source.src;\n      /* Spotify рисует свой плеер — его показываем, YouTube прячем за кадром */\n      if (/spotify\\.com/.test(source.src)) frame.classList.add('is-visible');\n    }\n  }\n\n  function stopMusic() {\n    playing = false;\n    toggle.classList.remove('is-playing');\n    if (source.kind === 'audio') $('musicAudio').pause();\n    else {\n      const frame = $('musicFrame');\n      frame.src = '';\n      frame.classList.remove('is-visible');\n      frame.hidden = true;\n    }\n  }\n\n  if (source) {\n    toggle.classList.add('is-on');\n    toggle.addEventListener('click', () => (playing ? stopMusic() : startMusic()));\n  }\n\n  /* ---------- слайд с фотографиями ---------- */\n  const photos = (card.photos || []).filter(Boolean);\n  if (photos.length) {\n    const slide = document.createElement('article');\n    slide.className = 'slide';\n    slide.dataset.slide = 'photos';\n    slide.innerHTML = '<p class=\"eyebrow pink\">наши кадры</p>' +\n                      '<div class=\"photo-frame\"></div><div class=\"photo-dots\"></div>';\n    const finale = document.querySelector('[data-slide=\"finale\"]');\n    finale.parentNode.insertBefore(slide, finale);\n\n    const frame = slide.querySelector('.photo-frame');\n    const dots = slide.querySelector('.photo-dots');\n    let shown = 0;\n\n    photos.forEach((src, i) => {\n      const img = new Image();\n      img.src = src;\n      img.alt = `Фото ${i + 1}`;\n      img.loading = i === 0 ? 'eager' : 'lazy';\n      if (i === 0) img.classList.add('is-active');\n      frame.appendChild(img);\n\n      const dot = document.createElement('button');\n      dot.type = 'button';\n      dot.setAttribute('aria-label', `Фото ${i + 1}`);\n      if (i === 0) dot.classList.add('is-active');\n      dot.addEventListener('click', () => show(i));\n      dots.appendChild(dot);\n    });\n\n    const imgs = [...frame.children];\n    const dotEls = [...dots.children];\n    function show(next) {\n      shown = (next + photos.length) % photos.length;\n      imgs.forEach((el, i) => el.classList.toggle('is-active', i === shown));\n      dotEls.forEach((el, i) => el.classList.toggle('is-active', i === shown));\n    }\n    if (photos.length > 1) setInterval(() => show(shown + 1), 5000);\n  }\n\n  /* ---------- письмо с пожеланиями ---------- */\n  const wishesEl = $('wishes');\n  (card.wishes || []).forEach((text) => {\n    const li = document.createElement('li');\n    li.innerHTML = '<span></span>';\n    li.querySelector('span').textContent = text;\n    wishesEl.appendChild(li);\n  });\n\n  const timers = [];\n  let letterPlayed = false;\n  let letterDone = false;\n\n  function finishLetter() {\n    timers.splice(0).forEach(clearTimeout);\n    $('letterTitleText').textContent = card.letterTitle || '';\n    $('caret').classList.add('is-done');\n    $('letterIntro').textContent = card.letterIntro || '';\n    [...wishesEl.children].forEach((li) => li.classList.add('is-shown'));\n    $('letterClosing').textContent = card.letterClosing || '';\n    $('letterClosing').classList.add('is-shown');\n    $('skipHint').hidden = true;\n    letterDone = true;\n  }\n\n  function playLetter() {\n    if (letterPlayed) return;\n    letterPlayed = true;\n    if (reduced) { finishLetter(); return; }\n\n    const title = card.letterTitle || '';\n    const titleEl = $('letterTitleText');\n    let i = 0;\n\n    const typeNext = () => {\n      titleEl.textContent = title.slice(0, ++i);\n      if (i < title.length) timers.push(setTimeout(typeNext, 55));\n      else {\n        $('caret').classList.add('is-done');\n        $('letterIntro').textContent = card.letterIntro || '';\n        [...wishesEl.children].forEach((li, n) => {\n          timers.push(setTimeout(() => li.classList.add('is-shown'), 260 + n * 420));\n        });\n        timers.push(setTimeout(() => {\n          $('letterClosing').textContent = card.letterClosing || '';\n          $('letterClosing').classList.add('is-shown');\n          $('skipHint').hidden = true;\n          letterDone = true;\n        }, 260 + wishesEl.children.length * 420));\n      }\n    };\n    timers.push(setTimeout(typeNext, 400));\n  }\n\n  document.querySelector('[data-slide=\"letter\"]').addEventListener('click', (e) => {\n    if (letterPlayed && !letterDone && !e.target.closest('button')) finishLetter();\n  });\n\n  /* ---------- навигация по слайдам ---------- */\n  const slidesEl = $('slides');\n  const slides = [...slidesEl.children];\n  const dotsEl = $('dots');\n  const prevBtn = document.querySelector('.nav-btn[data-dir=\"prev\"]');\n  const nextBtn = document.querySelector('.nav-btn[data-dir=\"next\"]');\n  let current = 0;\n\n  slides.forEach((_, i) => {\n    const dot = document.createElement('button');\n    dot.type = 'button';\n    dot.setAttribute('aria-label', `Слайд ${i + 1}`);\n    if (i === 0) dot.classList.add('is-active');\n    dot.addEventListener('click', () => goTo(i));\n    dotsEl.appendChild(dot);\n  });\n\n  function goTo(next) {\n    current = Math.max(0, Math.min(next, slides.length - 1));\n    slides.forEach((el, i) => el.classList.toggle('is-active', i === current));\n    [...dotsEl.children].forEach((el, i) => el.classList.toggle('is-active', i === current));\n    prevBtn.disabled = current === 0;\n    nextBtn.disabled = current === slides.length - 1;\n    if (slides[current].dataset.slide === 'letter') playLetter();\n    scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  prevBtn.addEventListener('click', () => goTo(current - 1));\n  nextBtn.addEventListener('click', () => goTo(current + 1));\n  $('unlockBtn').addEventListener('click', () => goTo(current + 1));\n  addEventListener('keydown', (e) => {\n    if ($('screenDeck').hidden) return;\n    if (e.key === 'ArrowLeft') goTo(current - 1);\n    if (e.key === 'ArrowRight') goTo(current + 1);\n  });\n\n  let touchX = null;\n  slidesEl.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });\n  slidesEl.addEventListener('touchend', (e) => {\n    if (touchX === null) return;\n    const dx = e.changedTouches[0].clientX - touchX;\n    if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));\n    touchX = null;\n  }, { passive: true });\n\n  /* ---------- переходы между экранами ---------- */\n  const screens = { gift: $('screenGift'), deck: $('screenDeck') };\n\n  function showScreen(name) {\n    Object.entries(screens).forEach(([key, el]) => { el.hidden = key !== name; });\n    $('backBtn').hidden = name === 'gift';\n    scrollTo({ top: 0 });\n  }\n\n  let opened = false;\n  function openGift() {\n    if (opened) return;\n    opened = true;\n    $('giftbox').classList.add('is-opening');\n    startMusic();\n    setTimeout(() => { showScreen('deck'); goTo(0); }, reduced ? 0 : 520);\n  }\n\n  const box = $('giftbox');\n  const giftTilt = $('giftTilt');\n\n  if (!reduced && matchMedia('(hover: hover)').matches) {\n    box.addEventListener('pointermove', (e) => {\n      const r = box.getBoundingClientRect();\n      const dx = (e.clientX - r.left) / r.width - 0.5;\n      const dy = (e.clientY - r.top) / r.height - 0.5;\n      giftTilt.style.transform = `rotateX(${-20 - dy * 12}deg) rotateY(${dx * 26}deg)`;\n    });\n    box.addEventListener('pointerleave', () => { giftTilt.style.transform = ''; });\n  }\n\n  box.addEventListener('click', openGift);\n  box.addEventListener('keydown', (e) => {\n    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }\n  });\n\n  $('backBtn').addEventListener('click', () => {\n    opened = false;\n    box.classList.remove('is-opening');\n    showScreen('gift');\n  });\n\n  $('replayBtn').addEventListener('click', () => {\n    opened = false;\n    box.classList.remove('is-opening');\n    showScreen('gift');\n  });\n\n  /* ---------- торт: 3D-модель, которую можно крутить ---------- */\n  const NAME_ON_CAKE = (card.to || '').trim();\n\n  function buildCake() {\n    const orbit = $('cakeOrbit');\n    if (!orbit) return null;\n\n    const R = 96;      // радиус\n    const H = 76;      // высота бока\n    const N = 30;      // из скольких панелей собран цилиндр\n    const step = 360 / N;\n    const parts = [];\n\n    for (let i = 0; i < N; i++) {\n      const a = i * step;\n      const panel = document.createElement('div');\n      panel.className = 'c-panel';\n      panel.style.transform = `translate(-50%, -50%) rotateY(${a}deg) translateZ(${R}em)`;\n      /* лёгкая разница яркости по кругу даёт объём */\n      panel.style.filter = `brightness(${(0.84 + 0.16 * Math.cos((a - 25) * Math.PI / 180)).toFixed(3)})`;\n      const drip = document.createElement('span');\n      drip.className = 'c-drip';\n      drip.style.height = (20 + Math.round(Math.abs(Math.sin(i * 1.7)) * 16)) + 'em';\n      panel.appendChild(drip);\n      parts.push(panel);\n    }\n\n    /* Крышку торта приподнимаем над кромкой панелей: ровно в их плоскости\n       браузер не может решить, что рисовать первым, и прячет её за боками. */\n    const TOP_Y = H / 2 + 3;\n    const top = document.createElement('div');\n    top.className = 'c-top';\n    top.style.transform = `translate(-50%, -50%) rotateX(90deg) translateZ(${TOP_Y}em)`;\n    parts.push(top);\n\n    /* свеча — тоже цилиндр, иначе с боку она схлопнулась бы в линию */\n    const CR = 8, CH = 54, CN = 10, CAKE_BACK = 44;\n    for (let i = 0; i < CN; i++) {\n      const a = i * (360 / CN);\n      const seg = document.createElement('div');\n      seg.className = 'c-candle';\n      seg.style.transform = `translate(-50%, -50%) translateY(${-TOP_Y - CH / 2}em) ` +\n        `translateZ(${-CAKE_BACK}em) rotateY(${a}deg) translateZ(${CR}em)`;\n      parts.push(seg);\n    }\n\n    const flame = document.createElement('div');\n    flame.className = 'c-flame';\n    flame.style.transform = `translate(-50%, -50%) translateY(${-TOP_Y - CH - 11}em) translateZ(${-CAKE_BACK}em)`;\n    parts.push(flame);\n\n    /* имя пишем на верхней плоскости — как кремом на настоящем торте */\n    if (NAME_ON_CAKE) {\n      const name = document.createElement('span');\n      name.className = 'c-name';\n      name.textContent = NAME_ON_CAKE;\n      top.appendChild(name);\n    }\n\n    orbit.append(...parts);\n    return orbit;\n  }\n\n  const orbit = buildCake();\n\n  if (orbit) {\n    let angle = -12;      // лёгкий разворот, чтобы бок торта тоже читался\n    let velocity = 0.05;  // сама медленно крутится, пока её не трогают\n    let dragging = false;\n    let lastX = 0;\n    let touched = false;\n\n    const apply = () => { orbit.style.transform = `rotateX(-38deg) rotateY(${angle}deg)`; };\n    apply();\n\n    const spin = () => {\n      if (!dragging) {\n        angle += velocity;\n        if (Math.abs(velocity) > 0.05) velocity *= 0.95;\n        else velocity = velocity < 0 ? -0.05 : 0.05;\n        apply();\n      }\n      requestAnimationFrame(spin);\n    };\n    if (!reduced) requestAnimationFrame(spin);\n\n    const stage = $('cake3d');\n    stage.addEventListener('pointerdown', (e) => {\n      dragging = true;\n      lastX = e.clientX;\n      stage.setPointerCapture(e.pointerId);\n      if (!touched) { touched = true; $('cakeHint').classList.add('is-hidden'); }\n    });\n    stage.addEventListener('pointermove', (e) => {\n      if (!dragging) return;\n      const dx = e.clientX - lastX;\n      lastX = e.clientX;\n      angle += dx * 0.45;\n      velocity = dx * 0.12;\n      apply();\n    });\n    const endDrag = (e) => {\n      if (!dragging) return;\n      dragging = false;\n      if (stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);\n    };\n    stage.addEventListener('pointerup', endDrag);\n    stage.addEventListener('pointercancel', endDrag);\n  }\n\n  goTo(0);\n  showScreen('gift');\n})();\n", "create": "/* Конструктор открытки: собирает форму в ссылку вида index.html#<base64url>. */\n(function () {\n  const $ = (id) => document.getElementById(id);\n  let attached = [];   // фото, вшитые в ссылку (data:URL)\n\n  /* ---------- темы ---------- */\n  const themeSelect = $('theme');\n  Object.entries(THEMES).forEach(([key, t]) => {\n    themeSelect.add(new Option(t.label, key, key === DEFAULT_CARD.theme, key === DEFAULT_CARD.theme));\n  });\n  themeSelect.addEventListener('change', () => applyTheme({ theme: themeSelect.value }));\n\n  /* ---------- предзаполнение: пример или редактирование существующей ссылки ---------- */\n  const preset = readCardFromLocation() || DEFAULT_CARD;\n  const TEXT_FIELDS = ['to', 'from', 'date', 'signoff', 'letterTitle', 'letterIntro',\n                       'letterClosing', 'finaleTitle', 'finaleText', 'music'];\n  TEXT_FIELDS.forEach((id) => { $(id).value = preset[id] || ''; });\n  $('wishes').value = (preset.wishes || []).join('\\n');\n  if (preset.theme && THEMES[preset.theme]) themeSelect.value = preset.theme;\n\n  const presetPhotos = preset.photos || [];\n  $('photoUrls').value = presetPhotos.filter((p) => !p.startsWith('data:')).join('\\n');\n  attached = presetPhotos.filter((p) => p.startsWith('data:'));\n  applyTheme({ theme: themeSelect.value });\n\n  /* ---------- сжатие приложенных фото ---------- */\n  function compress(file, maxSide = 900, quality = 0.72) {\n    return new Promise((resolve, reject) => {\n      const url = URL.createObjectURL(file);\n      const img = new Image();\n      img.onload = () => {\n        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));\n        const canvas = document.createElement('canvas');\n        canvas.width = Math.round(img.width * scale);\n        canvas.height = Math.round(img.height * scale);\n        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n        URL.revokeObjectURL(url);\n        resolve(canvas.toDataURL('image/jpeg', quality));\n      };\n      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };\n      img.src = url;\n    });\n  }\n\n  $('photoFiles').addEventListener('change', async (e) => {\n    const files = [...e.target.files];\n    if (!files.length) return;\n    $('photoStatus').textContent = 'Обрабатываю фотографии…';\n    try {\n      attached = attached.concat(await Promise.all(files.map((f) => compress(f))));\n      const kb = Math.round(attached.join('').length / 1024);\n      $('photoStatus').textContent = `Прикреплено фото: ${attached.length} (~${kb} КБ в ссылке).`;\n    } catch (err) {\n      $('photoStatus').textContent = 'Не удалось прочитать один из файлов.';\n    }\n  });\n\n  /* ---------- сборка данных ---------- */\n  function collect() {\n    const data = { theme: themeSelect.value };\n    TEXT_FIELDS.forEach((id) => { data[id] = $(id).value.trim(); });\n    data.wishes = $('wishes').value.split('\\n').map((s) => s.trim()).filter(Boolean);\n    data.photos = $('photoUrls').value.split('\\n').map((s) => s.trim()).filter(Boolean).concat(attached);\n    return data;\n  }\n\n  const buildUrl = () => cardBaseUrl() + '#' + encodeCard(collect());\n\n  /* ---------- действия ---------- */\n  let toastTimer = null;\n  function toast(text) {\n    const el = $('toast');\n    el.textContent = text;\n    el.classList.add('is-visible');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => el.classList.remove('is-visible'), 2200);\n  }\n\n  $('form').addEventListener('submit', (e) => {\n    e.preventDefault();\n    const url = buildUrl();\n    $('resultLink').value = url;\n    $('openBtn').href = url;\n    $('waBtn').href = 'https://wa.me/?text=' + encodeURIComponent('Тебе открытка 🎁 ' + url);\n    $('result').classList.add('is-visible');\n\n    const kb = Math.round(url.length / 1024);\n    $('sizeHint').textContent = kb > 8\n      ? `Длина ссылки ~${kb} КБ. Мессенджеры такое обычно переваривают, но если ссылка обрежется — замени вложенные фото на ссылки.`\n      : `Длина ссылки ~${kb} КБ — отправляется куда угодно.`;\n    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n  });\n\n  $('previewBtn').addEventListener('click', () => window.open(buildUrl(), '_blank', 'noopener'));\n\n  $('copyBtn').addEventListener('click', async () => {\n    try {\n      await navigator.clipboard.writeText($('resultLink').value);\n      toast('Ссылка скопирована');\n    } catch (e) {\n      $('resultLink').select();\n      document.execCommand('copy');\n      toast('Ссылка скопирована');\n    }\n  });\n})();\n"};
