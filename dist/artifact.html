<title>Открытка Чарос</title>
<meta name="description" content="Поздравительная открытка с подарком, тортом и списком пожеланий.">
<meta name="theme-color" content="#17171d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ токены ============ */
:root {
  --bg: #17171d;
  --accent: #ff2e7e;
  --warm: #ffb347;
  --glow: #7b2ff7;
  --text: #f6f4f8;
  --muted: rgba(246, 244, 248, 0.6);
  --line: rgba(255, 255, 255, 0.12);
  --panel: rgba(255, 255, 255, 0.05);
  --script: 'Caveat', 'Segoe Script', cursive;
  --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

/* Собственные display у кнопок и слайдов перебивают правило браузера для [hidden]. */
[hidden] { display: none !important; }

html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
  text-size-adjust: 100%;
  -webkit-text-size-adjust: 100%;
}

/* тёплые пятна света по углам */
body::before {
  content: '';
  position: fixed;
  inset: -25vmax;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(34vmax 34vmax at 18% 22%, color-mix(in srgb, var(--glow) 34%, transparent), transparent 70%),
    radial-gradient(40vmax 40vmax at 84% 76%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 72%),
    radial-gradient(30vmax 30vmax at 70% 12%, color-mix(in srgb, var(--warm) 16%, transparent), transparent 70%);
  filter: blur(24px);
  animation: drift 26s ease-in-out infinite alternate;
}

@keyframes drift {
  from { transform: translate3d(-2%, -1%, 0) scale(1); }
  to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
}

#confetti {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ============ общие элементы ============ */
.screen {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: calc(84px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-left)) calc(48px + env(safe-area-inset-bottom));
  text-align: center;
}


.eyebrow {
  margin: 0;
  font-size: clamp(11px, 3vw, 13px);
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
}
.eyebrow.gold { color: var(--warm); }
.eyebrow.pink { color: var(--accent); }
.eyebrow.dim  { color: var(--muted); letter-spacing: 0.4em; }

.gradient-text {
  background: linear-gradient(100deg, var(--accent), var(--warm) 45%, var(--accent) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.script-name {
  font-family: var(--script);
  font-weight: 700;
  font-size: clamp(58px, 17vw, 132px);
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}

.script-line {
  font-family: var(--script);
  font-size: clamp(34px, 9vw, 60px);
  margin: 0;
  color: var(--text);
}

.hint {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 30px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(100deg, var(--accent), var(--warm));
  box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 38%, transparent);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px color-mix(in srgb, var(--accent) 46%, transparent); }
.btn:active { transform: translateY(0); }

.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.ghost-btn:hover { background: rgba(255, 255, 255, 0.11); }

:where(button, a, [tabindex]):focus-visible {
  outline: 2px solid var(--warm);
  outline-offset: 3px;
}

.back-btn {
  position: fixed;
  left: calc(16px + env(safe-area-inset-left));
  top: calc(16px + env(safe-area-inset-top));
  z-index: 30;
}

/* ============ 1. подарочная коробка ============ */
/* Настоящая 3D-модель на CSS-трансформациях: коробка из граней плюс объёмная крышка.
   Все размеры в em, а масштаб задаёт font-size сцены — так коробка тянется под экран. */
.gift-stage {
  font-size: clamp(1px, 0.3vw, 1.6px);
  width: 240em;
  height: 250em;
  perspective: 900em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.gift-tilt,
.gift-sway,
.gift-body,
.gift-lid {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-style: preserve-3d;
}

.gift-tilt {
  width: 0;
  height: 0;
  transform: rotateX(14deg);
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.gift-sway {
  width: 0;
  height: 0;
  animation: sway 7s ease-in-out infinite alternate, hover 3.6s ease-in-out infinite;
}

@keyframes sway {
  from { rotate: y -26deg; }
  to   { rotate: y 26deg; }
}
@keyframes hover {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -10em; }
}

.gface {
  position: absolute;
  left: 50%;
  top: 50%;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1.4px),
    linear-gradient(155deg,
      color-mix(in srgb, var(--accent) 52%, #1d0f18),
      color-mix(in srgb, var(--accent) 30%, #170d14) 55%,
      color-mix(in srgb, var(--warm) 22%, #1a1016));
  background-size: 26em 26em, auto;
  backface-visibility: hidden;
}

/* Лента: вертикальная полоса на каждой боковой грани. */
.gift-body .gface::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 17%;
  translate: -50% 0;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--accent) 62%, #000),
    var(--accent) 44%, #ffa8ca 50%, var(--accent) 56%,
    color-mix(in srgb, var(--accent) 62%, #000));
}

/* корпус: 200 x 130, глубина 160 */
.gf { width: 200em; height: 130em; transform: translate(-50%, -50%) translateZ(80em); }
.gb { width: 200em; height: 130em; transform: translate(-50%, -50%) rotateY(180deg) translateZ(80em); }
.gr { width: 160em; height: 130em; transform: translate(-50%, -50%) rotateY(90deg) translateZ(100em); }
.gl { width: 160em; height: 130em; transform: translate(-50%, -50%) rotateY(-90deg) translateZ(100em); }
.gr, .lr { filter: brightness(0.72); }
.gl, .ll { filter: brightness(0.86); }
.gb, .lb { filter: brightness(0.6); }

/* крышка: 214 x 36, глубина 174, поднята над корпусом */
.gift-lid {
  width: 0;
  height: 0;
  transform: translateY(-83em);
  transition: transform 0.75s cubic-bezier(0.5, -0.4, 0.4, 1.4), opacity 0.6s ease;
}

.lt {
  width: 214em;
  height: 174em;
  transform-style: preserve-3d;
  backface-visibility: visible;
  transform: translate(-50%, -50%) rotateX(90deg) translateZ(18em);
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1.4px),
    linear-gradient(150deg,
      color-mix(in srgb, var(--accent) 62%, #24121c),
      color-mix(in srgb, var(--accent) 38%, #1c101a) 60%,
      color-mix(in srgb, var(--warm) 26%, #1d1218));
}
.lf { width: 214em; height: 36em; transform: translate(-50%, -50%) translateZ(87em); }
.lb { width: 214em; height: 36em; transform: translate(-50%, -50%) rotateY(180deg) translateZ(87em); }
.lr { width: 174em; height: 36em; transform: translate(-50%, -50%) rotateY(90deg) translateZ(107em); }
.ll { width: 174em; height: 36em; transform: translate(-50%, -50%) rotateY(-90deg) translateZ(107em); }

/* лента на крышке идёт крестом */
.gift-lid .lf::before,
.gift-lid .lb::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 17%;
  translate: -50% 0;
  background: var(--accent);
  box-shadow: 0 0 18em color-mix(in srgb, var(--accent) 60%, transparent);
}
.gift-lid .lr::before,
.gift-lid .ll::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 21%;
  translate: -50% 0;
  background: var(--accent);
  box-shadow: 0 0 18em color-mix(in srgb, var(--accent) 60%, transparent);
}
.lt::before,
.lt::after {
  content: '';
  position: absolute;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--accent) 58%, #000),
    var(--accent) 44%, #ffa8ca 50%, var(--accent) 56%,
    color-mix(in srgb, var(--accent) 58%, #000));
  box-shadow: 0 0 22em color-mix(in srgb, var(--accent) 55%, transparent);
}
.lt::before { left: 50%; top: 0; bottom: 0; width: 17%; translate: -50% 0; }
.lt::after  { top: 50%; left: 0; right: 0; height: 21%; translate: 0 -50%;
              background: linear-gradient(180deg,
                color-mix(in srgb, var(--accent) 58%, #000),
                var(--accent) 44%, #ffa8ca 50%, var(--accent) 56%,
                color-mix(in srgb, var(--accent) 58%, #000)); }

/* Бант стоит на крышке: он живёт в системе координат самой крышки, а не её грани. */
.gift-lid .bow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 124em;
  height: auto;
  overflow: visible;
  translate: -50% -50%;
  transform: translateY(-54em);
  filter: drop-shadow(0 4em 10em rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 16em color-mix(in srgb, var(--accent) 55%, transparent));
}
.bow-loop { fill: url(#bowFill); }
.bow-tail { fill: color-mix(in srgb, var(--accent) 82%, #000); }
.bow-knot { fill: url(#bowFill); }

/* мягкая тень под коробкой, лежит на «полу» */
.gift-shadow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 230em;
  height: 170em;
  transform: translate(-50%, -50%) rotateX(90deg) translateZ(-72em);
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.6), transparent);
  filter: blur(6em);
}

.gift-stage:hover .gift-tilt { transform: rotateX(22deg); }

/* открытие: крышка взлетает и уходит, коробка растворяется */
.gift-stage.is-opening .gift-lid {
  transform: translateY(-260em) rotateZ(24deg) rotateX(30deg);
  opacity: 0;
}
.gift-stage.is-opening .gift-sway { animation: none; }
.gift-stage.is-opening {
  transition: opacity 0.5s ease 0.25s, scale 0.6s ease 0.2s;
  opacity: 0;
  scale: 1.25;
}

/* ============ 2. слайды ============ */
.screen-deck { justify-content: flex-start; padding-top: 76px; }

.dots {
  position: fixed;
  left: 50%;
  top: calc(22px + env(safe-area-inset-top));
  translate: -50% 0;
  z-index: 30;
  display: flex;
  gap: 12px;
}
.dots button {
  position: relative;
  width: 13px;
  height: 13px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.08);
  cursor: pointer;
  transition: background 0.3s, box-shadow 0.3s;
}
/* Точки маленькие — расширяем область нажатия до пальца, не трогая вид. */
.dots button::after {
  content: '';
  position: absolute;
  inset: -14px -8px;
}
.dots button.is-active {
  background: color-mix(in srgb, var(--accent) 60%, #fff);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}

.slides {
  width: 100%;
  max-width: 700px;
  margin: auto;
}

.slide { display: none; }
.slide.is-active {
  display: block;
  animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: none; }
}

.nav-btn {
  position: fixed;
  top: 50%;
  translate: 0 -50%;
  z-index: 30;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.nav-btn[data-dir="prev"] { left: calc(18px + env(safe-area-inset-left)); }
.nav-btn[data-dir="next"] { right: calc(18px + env(safe-area-inset-right)); }
.nav-btn:disabled { opacity: 0.25; cursor: default; }

/* — слайд 1: открытка — */
.card-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 3vw, 26px);
}
.card-name-row .party { font-size: clamp(30px, 8vw, 58px); line-height: 1; }
.card-name-row .party.right { scale: -1 1; }

.card-glow {
  position: absolute;
  left: 50%;
  top: 26%;
  translate: -50% -50%;
  width: min(560px, 88vw);
  aspect-ratio: 2 / 1;
  border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--warm) 26%, transparent), transparent);
  filter: blur(10px);
  pointer-events: none;
  z-index: -1;
}

.card-date { margin: 18px 0 0; color: var(--muted); font-size: 16px; }
.card-signoff { margin: 18px 0 0; color: var(--muted); font-size: 16px; }
.card-actions { margin-top: 30px; }

/* — слайд 2: письмо с пожеланиями — */
.cake-stage {
  perspective: 900px;
  display: flex;
  justify-content: center;
}

.cake {
  display: block;
  width: clamp(150px, 38vw, 210px);
  height: auto;
  /* float двигает через translate, наклон — через transform: свойства не конфликтуют */
  animation: floatY 4s ease-in-out infinite;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  transform-style: preserve-3d;
}

@keyframes floatY {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -12px; }
}
@keyframes flicker {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  30%      { transform: scale(0.92, 1.06) rotate(-3deg); opacity: 0.92; }
  65%      { transform: scale(1.06, 0.95) rotate(3deg); opacity: 1; }
}

.letter-title {
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(28px, 7vw, 46px);
  margin: 22px 0 0;
  min-height: 1.2em;
}
.caret {
  display: inline-block;
  width: 3px;
  height: 0.9em;
  translate: 0 0.1em;
  background: var(--accent);
  animation: blink 1s steps(2) infinite;
}
.caret.is-done { display: none; }
@keyframes blink { 50% { opacity: 0; } }

.letter-body {
  margin: 26px auto 0;
  max-width: 620px;
  text-align: left;
  padding: clamp(20px, 5vw, 30px);
  border-radius: 22px;
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
}

.letter-intro { margin: 0 0 20px; font-size: 17px; line-height: 1.65; color: var(--muted); }

.wishes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; }

.wishes li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 12px;
  align-items: start;
  font-size: 17px;
  line-height: 1.6;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.wishes li.is-shown { opacity: 1; transform: none; }

.wishes li::before {
  content: counter(wish);
  counter-increment: wish;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--bg);
  background: linear-gradient(140deg, var(--warm), var(--accent));
}
.wishes { counter-reset: wish; }

.letter-closing {
  margin: 24px 0 0;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 17px;
  line-height: 1.65;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.letter-closing.is-shown { opacity: 1; }

.letter-sign {
  margin: 14px 0 0;
  text-align: right;
  font-family: var(--script);
  font-size: 30px;
  color: var(--accent);
}

.skip-hint {
  margin: 16px 0 0;
  font-size: 13px;
  color: var(--muted);
}

/* — слайд с фотографиями — */
.photo-frame {
  position: relative;
  margin: 20px auto 0;
  max-width: 460px;
  aspect-ratio: 4 / 5;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.35);
}
.photo-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.9s ease;
}
.photo-frame img.is-active { opacity: 1; }

.photo-dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.photo-dots button {
  width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%;
  background: var(--line); cursor: pointer; transition: background 0.3s, width 0.3s;
}
.photo-dots button.is-active { background: var(--accent); width: 20px; border-radius: 4px; }

/* — финальный слайд — */
.finale-emoji { font-size: clamp(64px, 16vw, 96px); animation: float 4s ease-in-out infinite; }
.finale-title { font-family: var(--display); font-size: clamp(30px, 7vw, 48px); margin: 20px 0 0; }
.finale-text { margin: 14px 0 30px; font-size: 17px; line-height: 1.6; color: var(--muted); }

/* ============ музыка ============ */
.music-toggle {
  position: fixed;
  right: calc(18px + env(safe-area-inset-right));
  bottom: calc(18px + env(safe-area-inset-bottom));
  z-index: 30;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.5);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  display: none;
  place-items: center;
}
.music-toggle.is-on { display: grid; }
.music-toggle.is-playing { animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.music-frame { position: fixed; left: -9999px; width: 320px; height: 90px; border: 0; }
.music-frame.is-visible {
  left: auto; right: 18px; bottom: 82px; z-index: 30;
  border-radius: 14px; box-shadow: var(--shadow);
}

/* ============ конструктор ============ */
.builder {
  position: relative;
  z-index: 2;
  max-width: 640px;
  margin: 0 auto;
  padding: 48px 20px 80px;
}

.builder h1 { font-family: var(--display); font-size: clamp(34px, 8vw, 52px); margin: 0 0 8px; }
.builder .lead { color: var(--muted); margin: 0 0 32px; line-height: 1.6; }

.field { margin-bottom: 20px; }
.field label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font: inherit;
  font-size: 15px;
}
.field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: 1px;
}
.field .hint { margin-top: 7px; font-size: 12.5px; color: var(--muted); line-height: 1.5; text-transform: none; letter-spacing: 0; }
.field select option { background: #14121a; color: #fff; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

.result { margin-top: 28px; display: none; }
.result.is-visible { display: block; }

.result-link {
  width: 100%;
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.35);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
  word-break: break-all;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  translate: -50% 0;
  z-index: 60;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.82);
  border: 1px solid var(--line);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, translate 0.3s;
}
.toast.is-visible { opacity: 1; translate: -50% -8px; }

@media (max-width: 560px) {
  /* На узком экране стрелки по бокам легли бы поверх текста — уводим их вниз слева. */
  .nav-btn {
    width: 48px;
    height: 48px;
    top: auto;
    translate: none;
    bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .nav-btn[data-dir="prev"] { left: calc(16px + env(safe-area-inset-left)); }
  .nav-btn[data-dir="next"] { left: calc(74px + env(safe-area-inset-left)); right: auto; }
  .screen-deck { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }

  .back-btn { padding: 9px 15px; font-size: 13px; }
  .screen { gap: 14px; }
  .letter-body { padding: 18px 16px; border-radius: 18px; }
  .letter-intro, .wishes li, .letter-closing { font-size: 16px; }
  .wishes li { grid-template-columns: 26px 1fr; gap: 10px; }
  .wishes li::before { width: 26px; height: 26px; font-size: 12px; }
  .letter-title { margin-top: 16px; }
  .card-name-row { gap: 4px; }
  .btn { padding: 14px 24px; font-size: 15px; }
  .row-2 { grid-template-columns: 1fr; }

/* base64url <-> UTF-8, чтобы открытка целиком помещалась в ссылку. */
function encodeCard(data) {
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeCard(str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
}

/* Открытка живёт в хэше: index.html#<base64url>.
   В однофайловой сборке перед данными стоит маркер "make:" — его снимаем. */
function readCardFromLocation() {
  let raw = location.hash.replace(/^#/, '');
  if (raw === 'make') raw = '';
  else if (raw.startsWith('make:')) raw = raw.slice(5);
  if (!raw) return null;
  try {
    return Object.assign({}, DEFAULT_CARD, decodeCard(raw));
  } catch (e) {
    console.warn('Не удалось разобрать ссылку открытки:', e);
    return null;
  }
}

function applyTheme(card) {
  const theme = THEMES[card.theme] || THEMES.party;
  const root = document.documentElement;
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--warm', theme.warm);
  root.style.setProperty('--glow', theme.glow);
}

/* Ссылка на музыку -> embed. Поддержаны YouTube, Spotify и прямые mp3. */
function musicSource(url) {
  if (!url) return null;
  const u = url.trim();
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if (m) {
    const t = (u.match(/[?&]t=(\d+)/) || [])[1];
    return {
      kind: 'iframe',
      src: `https://www.youtube.com/embed/${m[1]}?autoplay=1&loop=1&playlist=${m[1]}` + (t ? `&start=${t}` : '')
    };
  }
  m = u.match(/spotify\.com\/(?:intl-\w+\/)?(track|album|playlist)\/([\w]+)/);
  if (m) return { kind: 'iframe', src: `https://open.spotify.com/embed/${m[1]}/${m[2]}?autoplay=1` };
  if (/\.(mp3|ogg|wav|m4a)(\?.*)?$/i.test(u)) return { kind: 'audio', src: u };
  return { kind: 'iframe', src: u };
}

/* Адрес страницы открытки: рядом лежащий index.html либо этот же файл в однофайловой сборке. */
function cardBaseUrl() {
  const url = location.href.split('#')[0];
  return url.endsWith('create.html') ? url.replace(/create\.html$/, 'index.html') : url;
}

e\" title=\"Музыка\" allow=\"autoplay; encrypted-media\" hidden></iframe>\n<audio id=\"musicAudio\" loop hidden></audio>", "create": "<main class=\"builder\">\n  <h1>Своя открытка</h1>\n  <p class=\"lead\">\n    Заполни поля — получится ссылка, которую можно отправить в WhatsApp или Telegram.\n    Вся открытка зашита в саму ссылку: сервер и база данных не нужны, никто ничего не хранит.\n  </p>\n\n  <form id=\"form\" autocomplete=\"off\">\n    <div class=\"row-2\">\n      <div class=\"field\">\n        <label for=\"to\">Кому</label>\n        <input id=\"to\" placeholder=\"Например: Чарос\">\n      </div>\n      <div class=\"field\">\n        <label for=\"from\">От кого</label>\n        <input id=\"from\" placeholder=\"Например: Фирдавс\">\n      </div>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"date\">Дата</label>\n      <input id=\"date\" placeholder=\"18 августа\">\n    </div>\n\n    <div class=\"field\">\n      <label for=\"signoff\">Подпись перед именем</label>\n      <input id=\"signoff\" placeholder=\"С теплом,\">\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterTitle\">Заголовок письма</label>\n      <input id=\"letterTitle\" placeholder=\"С днём рождения!\">\n      <p class=\"hint\">Печатается по буквам на слайде с тортом.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterIntro\">Вступление письма</label>\n      <textarea id=\"letterIntro\" style=\"min-height:80px\"></textarea>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"wishes\">Пожелания</label>\n      <textarea id=\"wishes\" style=\"min-height:220px\"></textarea>\n      <p class=\"hint\">По одному пожеланию в строке — они появятся пронумерованным списком.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"letterClosing\">Концовка письма</label>\n      <textarea id=\"letterClosing\" style=\"min-height:80px\"></textarea>\n    </div>\n\n    <div class=\"row-2\">\n      <div class=\"field\">\n        <label for=\"finaleTitle\">Последний слайд: заголовок</label>\n        <input id=\"finaleTitle\">\n      </div>\n      <div class=\"field\">\n        <label for=\"finaleText\">Последний слайд: текст</label>\n        <input id=\"finaleText\">\n      </div>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"photoUrls\">Фотографии по ссылкам</label>\n      <textarea id=\"photoUrls\" style=\"min-height:90px\"\n                placeholder=\"https://…/photo1.jpg&#10;https://…/photo2.jpg\"></textarea>\n      <p class=\"hint\">По одной ссылке в строке. Есть фото — появится отдельный слайд.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"photoFiles\">Или прикрепить фото с устройства</label>\n      <input id=\"photoFiles\" type=\"file\" accept=\"image/*\" multiple>\n      <p class=\"hint\" id=\"photoStatus\">\n        Фото сжимаются и вшиваются прямо в ссылку. Больше 2–3 снимков — и ссылка станет очень длинной.\n      </p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"music\">Музыка</label>\n      <input id=\"music\" placeholder=\"Ссылка на YouTube, Spotify или .mp3\">\n      <p class=\"hint\">Включится, как только получатель откроет подарок.</p>\n    </div>\n\n    <div class=\"field\">\n      <label for=\"theme\">Тема</label>\n      <select id=\"theme\"></select>\n    </div>\n\n    <div class=\"btn-row\">\n      <button type=\"submit\" class=\"btn\">Создать ссылку</button>\n      <button type=\"button\" class=\"ghost-btn\" id=\"previewBtn\">Предпросмотр</button>\n    </div>\n  </form>\n\n  <div class=\"result\" id=\"result\">\n    <div class=\"field\" style=\"margin-top:24px\">\n      <label for=\"resultLink\">Ссылка на открытку</label>\n      <textarea class=\"result-link\" id=\"resultLink\" rows=\"4\" readonly></textarea>\n    </div>\n    <div class=\"btn-row\">\n      <button type=\"button\" class=\"btn\" id=\"copyBtn\">Скопировать</button>\n      <a class=\"ghost-btn\" id=\"openBtn\" target=\"_blank\" rel=\"noopener\">Открыть открытку</a>\n      <a class=\"ghost-btn\" id=\"waBtn\" target=\"_blank\" rel=\"noopener\">Отправить в WhatsApp</a>\n    </div>\n    <p class=\"hint\" id=\"sizeHint\" style=\"margin-top:14px;color:rgba(246,244,248,.6);font-size:12.5px\"></p>\n  </div>\n</main>\n\n<div class=\"toast\" id=\"toast\"></div>"};
const SCRIPTS = {"card": "/* Открытка: подарок → заставка → слайды (открытка, пожелания, фото, финал). */\n(function () {\n  const card = readCardFromLocation() || Object.assign({}, DEFAULT_CARD);\n  applyTheme(card);\n\n  const $ = (id) => document.getElementById(id);\n  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  /* ---------- тексты ---------- */\n  document.title = card.to ? `С днём рождения, ${card.to}! 🎉` : 'С днём рождения!';\n\n  $('giftTo').textContent = card.to || 'Тебе';\n  $('cardName').textContent = card.to || '';\n  $('cardDate').textContent = card.date || '';\n  $('cardDate').hidden = !card.date;\n  $('cardSignoff').textContent = card.signoff || '';\n  $('cardFrom').textContent = card.from || '';\n  $('letterSign').textContent = card.from ? `— ${card.from}` : '';\n  $('finaleTitle').textContent = card.finaleTitle || '';\n  $('finaleText').textContent = card.finaleText || '';\n\n  /* ---------- конфетти ---------- */\n  const confetti = $('confetti');\n  const cctx = confetti.getContext('2d');\n  let pieces = [];\n\n  function sizeCanvas(el, context) {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    el.width = innerWidth * dpr;\n    el.height = innerHeight * dpr;\n    el.style.width = innerWidth + 'px';\n    el.style.height = innerHeight + 'px';\n    context.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n\n  function makePiece(fromTop) {\n    return {\n      x: Math.random() * innerWidth,\n      y: fromTop ? -20 - Math.random() * innerHeight : Math.random() * innerHeight,\n      w: 4 + Math.random() * 6,\n      h: 7 + Math.random() * 9,\n      speed: 18 + Math.random() * 40,\n      sway: 12 + Math.random() * 26,\n      phase: Math.random() * Math.PI * 2,\n      spin: (Math.random() - 0.5) * 3,\n      angle: Math.random() * Math.PI,\n      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],\n      alpha: 0.35 + Math.random() * 0.45\n    };\n  }\n\n  function resetConfetti() {\n    pieces = Array.from({ length: innerWidth < 600 ? 34 : 60 }, () => makePiece(false));\n  }\n\n  /* ---------- пасхалка: тап по фону рассыпает фонтан ---------- */\n  let tapBits = [];\n\n  function spawnBurst(x, y) {\n    if (reduced || tapBits.length > 90) return;\n    const count = 14;\n    for (let i = 0; i < count; i++) {\n      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;\n      const speed = 220 + Math.random() * 320;\n      tapBits.push({\n        x, y,\n        vx: Math.cos(angle) * speed,\n        vy: Math.sin(angle) * speed,\n        size: 20 + Math.random() * 20,\n        angle: (Math.random() - 0.5) * 0.8,\n        spin: (Math.random() - 0.5) * 6,\n        life: 1,\n        char: BURST_EMOJI[(Math.random() * BURST_EMOJI.length) | 0]\n      });\n    }\n  }\n\n  function drawBurst(dt) {\n    tapBits = tapBits.filter((p) => p.life > 0 && p.y < innerHeight + 80);\n    tapBits.forEach((p) => {\n      p.life -= dt * 0.42;\n      p.vy += 780 * dt;\n      p.x += p.vx * dt;\n      p.y += p.vy * dt;\n      p.angle += p.spin * dt;\n      cctx.save();\n      cctx.translate(p.x, p.y);\n      cctx.rotate(p.angle);\n      cctx.globalAlpha = Math.min(1, Math.max(p.life, 0) * 1.6);\n      cctx.font = `${p.size}px serif`;\n      cctx.textAlign = 'center';\n      cctx.textBaseline = 'middle';\n      cctx.fillText(p.char, 0, 0);\n      cctx.restore();\n    });\n    cctx.globalAlpha = 1;\n  }\n\n  /* Кнопки и ссылки не трогаем — там свои действия. */\n  addEventListener('pointerdown', (e) => {\n    if (e.target.closest('button, a, input, textarea, select')) return;\n    spawnBurst(e.clientX, e.clientY);\n  });\n\n  /* ---------- общий цикл анимации ---------- */\n  let last = performance.now();\n  function tick(now) {\n    const dt = Math.min((now - last) / 1000, 0.05);\n    last = now;\n\n    cctx.clearRect(0, 0, innerWidth, innerHeight);\n    pieces.forEach((p, i) => {\n      p.y += p.speed * dt;\n      p.phase += dt;\n      p.angle += p.spin * dt;\n      const x = p.x + Math.sin(p.phase) * p.sway;\n      cctx.save();\n      cctx.translate(x, p.y);\n      cctx.rotate(p.angle);\n      cctx.globalAlpha = p.alpha;\n      cctx.fillStyle = p.color;\n      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);\n      cctx.restore();\n      if (p.y > innerHeight + 30) pieces[i] = makePiece(true);\n    });\n    cctx.globalAlpha = 1;\n    if (tapBits.length) drawBurst(dt);\n    requestAnimationFrame(tick);\n  }\n\n  function resizeAll() {\n    sizeCanvas(confetti, cctx);\n    resetConfetti();\n  }\n\n  resizeAll();\n  addEventListener('resize', resizeAll);\n  if (!reduced) requestAnimationFrame(tick);\n\n  /* ---------- музыка ---------- */\n  const source = musicSource(card.music);\n  const toggle = $('musicToggle');\n  let playing = false;\n\n  function startMusic() {\n    if (!source || playing) return;\n    playing = true;\n    toggle.classList.add('is-on', 'is-playing');\n    if (source.kind === 'audio') {\n      const audio = $('musicAudio');\n      audio.src = source.src;\n      audio.volume = 0.6;\n      audio.play().catch(() => { playing = false; toggle.classList.remove('is-playing'); });\n    } else {\n      const frame = $('musicFrame');\n      frame.hidden = false;\n      frame.src = source.src;\n      /* Spotify рисует свой плеер — его показываем, YouTube прячем за кадром */\n      if (/spotify\\.com/.test(source.src)) frame.classList.add('is-visible');\n    }\n  }\n\n  function stopMusic() {\n    playing = false;\n    toggle.classList.remove('is-playing');\n    if (source.kind === 'audio') $('musicAudio').pause();\n    else {\n      const frame = $('musicFrame');\n      frame.src = '';\n      frame.classList.remove('is-visible');\n      frame.hidden = true;\n    }\n  }\n\n  if (source) {\n    toggle.classList.add('is-on');\n    toggle.addEventListener('click', () => (playing ? stopMusic() : startMusic()));\n  }\n\n  /* ---------- слайд с фотографиями ---------- */\n  const photos = (card.photos || []).filter(Boolean);\n  if (photos.length) {\n    const slide = document.createElement('article');\n    slide.className = 'slide';\n    slide.dataset.slide = 'photos';\n    slide.innerHTML = '<p class=\"eyebrow pink\">наши кадры</p>' +\n                      '<div class=\"photo-frame\"></div><div class=\"photo-dots\"></div>';\n    const finale = document.querySelector('[data-slide=\"finale\"]');\n    finale.parentNode.insertBefore(slide, finale);\n\n    const frame = slide.querySelector('.photo-frame');\n    const dots = slide.querySelector('.photo-dots');\n    let shown = 0;\n\n    photos.forEach((src, i) => {\n      const img = new Image();\n      img.src = src;\n      img.alt = `Фото ${i + 1}`;\n      img.loading = i === 0 ? 'eager' : 'lazy';\n      if (i === 0) img.classList.add('is-active');\n      frame.appendChild(img);\n\n      const dot = document.createElement('button');\n      dot.type = 'button';\n      dot.setAttribute('aria-label', `Фото ${i + 1}`);\n      if (i === 0) dot.classList.add('is-active');\n      dot.addEventListener('click', () => show(i));\n      dots.appendChild(dot);\n    });\n\n    const imgs = [...frame.children];\n    const dotEls = [...dots.children];\n    function show(next) {\n      shown = (next + photos.length) % photos.length;\n      imgs.forEach((el, i) => el.classList.toggle('is-active', i === shown));\n      dotEls.forEach((el, i) => el.classList.toggle('is-active', i === shown));\n    }\n    if (photos.length > 1) setInterval(() => show(shown + 1), 5000);\n  }\n\n  /* ---------- письмо с пожеланиями ---------- */\n  const wishesEl = $('wishes');\n  (card.wishes || []).forEach((text) => {\n    const li = document.createElement('li');\n    li.innerHTML = '<span></span>';\n    li.querySelector('span').textContent = text;\n    wishesEl.appendChild(li);\n  });\n\n  const timers = [];\n  let letterPlayed = false;\n  let letterDone = false;\n\n  function finishLetter() {\n    timers.splice(0).forEach(clearTimeout);\n    $('letterTitleText').textContent = card.letterTitle || '';\n    $('caret').classList.add('is-done');\n    $('letterIntro').textContent = card.letterIntro || '';\n    [...wishesEl.children].forEach((li) => li.classList.add('is-shown'));\n    $('letterClosing').textContent = card.letterClosing || '';\n    $('letterClosing').classList.add('is-shown');\n    $('skipHint').hidden = true;\n    letterDone = true;\n  }\n\n  function playLetter() {\n    if (letterPlayed) return;\n    letterPlayed = true;\n    if (reduced) { finishLetter(); return; }\n\n    const title = card.letterTitle || '';\n    const titleEl = $('letterTitleText');\n    let i = 0;\n\n    const typeNext = () => {\n      titleEl.textContent = title.slice(0, ++i);\n      if (i < title.length) timers.push(setTimeout(typeNext, 55));\n      else {\n        $('caret').classList.add('is-done');\n        $('letterIntro').textContent = card.letterIntro || '';\n        [...wishesEl.children].forEach((li, n) => {\n          timers.push(setTimeout(() => li.classList.add('is-shown'), 260 + n * 420));\n        });\n        timers.push(setTimeout(() => {\n          $('letterClosing').textContent = card.letterClosing || '';\n          $('letterClosing').classList.add('is-shown');\n          $('skipHint').hidden = true;\n          letterDone = true;\n        }, 260 + wishesEl.children.length * 420));\n      }\n    };\n    timers.push(setTimeout(typeNext, 400));\n  }\n\n  document.querySelector('[data-slide=\"letter\"]').addEventListener('click', (e) => {\n    if (letterPlayed && !letterDone && !e.target.closest('button')) finishLetter();\n  });\n\n  /* ---------- навигация по слайдам ---------- */\n  const slidesEl = $('slides');\n  const slides = [...slidesEl.children];\n  const dotsEl = $('dots');\n  const prevBtn = document.querySelector('.nav-btn[data-dir=\"prev\"]');\n  const nextBtn = document.querySelector('.nav-btn[data-dir=\"next\"]');\n  let current = 0;\n\n  slides.forEach((_, i) => {\n    const dot = document.createElement('button');\n    dot.type = 'button';\n    dot.setAttribute('aria-label', `Слайд ${i + 1}`);\n    if (i === 0) dot.classList.add('is-active');\n    dot.addEventListener('click', () => goTo(i));\n    dotsEl.appendChild(dot);\n  });\n\n  function goTo(next) {\n    current = Math.max(0, Math.min(next, slides.length - 1));\n    slides.forEach((el, i) => el.classList.toggle('is-active', i === current));\n    [...dotsEl.children].forEach((el, i) => el.classList.toggle('is-active', i === current));\n    prevBtn.disabled = current === 0;\n    nextBtn.disabled = current === slides.length - 1;\n    if (slides[current].dataset.slide === 'letter') playLetter();\n    scrollTo({ top: 0, behavior: 'smooth' });\n  }\n\n  prevBtn.addEventListener('click', () => goTo(current - 1));\n  nextBtn.addEventListener('click', () => goTo(current + 1));\n  $('unlockBtn').addEventListener('click', () => goTo(current + 1));\n  addEventListener('keydown', (e) => {\n    if ($('screenDeck').hidden) return;\n    if (e.key === 'ArrowLeft') goTo(current - 1);\n    if (e.key === 'ArrowRight') goTo(current + 1);\n  });\n\n  let touchX = null;\n  slidesEl.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });\n  slidesEl.addEventListener('touchend', (e) => {\n    if (touchX === null) return;\n    const dx = e.changedTouches[0].clientX - touchX;\n    if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));\n    touchX = null;\n  }, { passive: true });\n\n  /* ---------- переходы между экранами ---------- */\n  const screens = { gift: $('screenGift'), deck: $('screenDeck') };\n\n  function showScreen(name) {\n    Object.entries(screens).forEach(([key, el]) => { el.hidden = key !== name; });\n    $('backBtn').hidden = name === 'gift';\n    scrollTo({ top: 0 });\n  }\n\n  let opened = false;\n  function openGift() {\n    if (opened) return;\n    opened = true;\n    $('giftbox').classList.add('is-opening');\n    startMusic();\n    setTimeout(() => { showScreen('deck'); goTo(0); }, reduced ? 0 : 520);\n  }\n\n  const box = $('giftbox');\n  const giftTilt = $('giftTilt');\n\n  if (!reduced && matchMedia('(hover: hover)').matches) {\n    box.addEventListener('pointermove', (e) => {\n      const r = box.getBoundingClientRect();\n      const dx = (e.clientX - r.left) / r.width - 0.5;\n      const dy = (e.clientY - r.top) / r.height - 0.5;\n      giftTilt.style.transform = `rotateX(${14 + dy * 16}deg) rotateY(${dx * 24}deg)`;\n    });\n    box.addEventListener('pointerleave', () => { giftTilt.style.transform = ''; });\n  }\n\n  box.addEventListener('click', openGift);\n  box.addEventListener('keydown', (e) => {\n    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }\n  });\n\n  $('backBtn').addEventListener('click', () => {\n    opened = false;\n    box.classList.remove('is-opening');\n    showScreen('gift');\n  });\n\n  $('replayBtn').addEventListener('click', () => {\n    opened = false;\n    box.classList.remove('is-opening');\n    showScreen('gift');\n  });\n\n  /* ---------- лёгкий наклон торта за курсором ---------- */\n  const cake = $('cake');\n  if (cake && !reduced && matchMedia('(hover: hover)').matches) {\n    const stage = cake.parentElement;\n    stage.addEventListener('pointermove', (e) => {\n      const r = stage.getBoundingClientRect();\n      const dx = (e.clientX - r.left) / r.width - 0.5;\n      const dy = (e.clientY - r.top) / r.height - 0.5;\n      cake.style.transform = `rotateY(${dx * 22}deg) rotateX(${-dy * 16}deg)`;\n    });\n    stage.addEventListener('pointerleave', () => { cake.style.transform = ''; });\n  }\n\n  goTo(0);\n  showScreen('gift');\n})();\n", "create": "/* Конструктор открытки: собирает форму в ссылку вида index.html#<base64url>. */\n(function () {\n  const $ = (id) => document.getElementById(id);\n  let attached = [];   // фото, вшитые в ссылку (data:URL)\n\n  /* ---------- темы ---------- */\n  const themeSelect = $('theme');\n  Object.entries(THEMES).forEach(([key, t]) => {\n    themeSelect.add(new Option(t.label, key, key === DEFAULT_CARD.theme, key === DEFAULT_CARD.theme));\n  });\n  themeSelect.addEventListener('change', () => applyTheme({ theme: themeSelect.value }));\n\n  /* ---------- предзаполнение: пример или редактирование существующей ссылки ---------- */\n  const preset = readCardFromLocation() || DEFAULT_CARD;\n  const TEXT_FIELDS = ['to', 'from', 'date', 'signoff', 'letterTitle', 'letterIntro',\n                       'letterClosing', 'finaleTitle', 'finaleText', 'music'];\n  TEXT_FIELDS.forEach((id) => { $(id).value = preset[id] || ''; });\n  $('wishes').value = (preset.wishes || []).join('\\n');\n  if (preset.theme && THEMES[preset.theme]) themeSelect.value = preset.theme;\n\n  const presetPhotos = preset.photos || [];\n  $('photoUrls').value = presetPhotos.filter((p) => !p.startsWith('data:')).join('\\n');\n  attached = presetPhotos.filter((p) => p.startsWith('data:'));\n  applyTheme({ theme: themeSelect.value });\n\n  /* ---------- сжатие приложенных фото ---------- */\n  function compress(file, maxSide = 900, quality = 0.72) {\n    return new Promise((resolve, reject) => {\n      const url = URL.createObjectURL(file);\n      const img = new Image();\n      img.onload = () => {\n        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));\n        const canvas = document.createElement('canvas');\n        canvas.width = Math.round(img.width * scale);\n        canvas.height = Math.round(img.height * scale);\n        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n        URL.revokeObjectURL(url);\n        resolve(canvas.toDataURL('image/jpeg', quality));\n      };\n      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };\n      img.src = url;\n    });\n  }\n\n  $('photoFiles').addEventListener('change', async (e) => {\n    const files = [...e.target.files];\n    if (!files.length) return;\n    $('photoStatus').textContent = 'Обрабатываю фотографии…';\n    try {\n      attached = attached.concat(await Promise.all(files.map((f) => compress(f))));\n      const kb = Math.round(attached.join('').length / 1024);\n      $('photoStatus').textContent = `Прикреплено фото: ${attached.length} (~${kb} КБ в ссылке).`;\n    } catch (err) {\n      $('photoStatus').textContent = 'Не удалось прочитать один из файлов.';\n    }\n  });\n\n  /* ---------- сборка данных ---------- */\n  function collect() {\n    const data = { theme: themeSelect.value };\n    TEXT_FIELDS.forEach((id) => { data[id] = $(id).value.trim(); });\n    data.wishes = $('wishes').value.split('\\n').map((s) => s.trim()).filter(Boolean);\n    data.photos = $('photoUrls').value.split('\\n').map((s) => s.trim()).filter(Boolean).concat(attached);\n    return data;\n  }\n\n  const buildUrl = () => cardBaseUrl() + '#' + encodeCard(collect());\n\n  /* ---------- действия ---------- */\n  let toastTimer = null;\n  function toast(text) {\n    const el = $('toast');\n    el.textContent = text;\n    el.classList.add('is-visible');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(() => el.classList.remove('is-visible'), 2200);\n  }\n\n  $('form').addEventListener('submit', (e) => {\n    e.preventDefault();\n    const url = buildUrl();\n    $('resultLink').value = url;\n    $('openBtn').href = url;\n    $('waBtn').href = 'https://wa.me/?text=' + encodeURIComponent('Тебе открытка 🎁 ' + url);\n    $('result').classList.add('is-visible');\n\n    const kb = Math.round(url.length / 1024);\n    $('sizeHint').textContent = kb > 8\n      ? `Длина ссылки ~${kb} КБ. Мессенджеры такое обычно переваривают, но если ссылка обрежется — замени вложенные фото на ссылки.`\n      : `Длина ссылки ~${kb} КБ — отправляется куда угодно.`;\n    $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n  });\n\n  $('previewBtn').addEventListener('click', () => window.open(buildUrl(), '_blank', 'noopener'));\n\n  $('copyBtn').addEventListener('click', async () => {\n    try {\n      await navigator.clipboard.writeText($('resultLink').value);\n      toast('Ссылка скопирована');\n    } catch (e) {\n      $('resultLink').select();\n      document.execCommand('copy');\n      toast('Ссылка скопирована');\n    }\n  });\n})();\n"};
