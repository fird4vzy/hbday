<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения!</title>
<meta name="description" content="Поздравительная открытка с подарком, тортом и списком пожеланий.">
<meta name="theme-color" content="#17171d">
<meta property="og:title" content="Тебе открытка 🎁">
<meta property="og:description" content="Открой — это для тебя.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<canvas id="confetti"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ppCone" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9285c"/><stop offset="0.45" stop-color="#ff6aa0"/>
      <stop offset="1" stop-color="#ff2e7e"/>
    </linearGradient>
    <g id="popperArt">
<path d="M10 112 L62 26 L96 52 Z" fill="url(#ppCone)"/>
          <path d="M27 84 L69 40 L77 46 L34 92 Z" fill="#fff" opacity="0.35"/>
          <ellipse cx="79" cy="39" rx="10" ry="19" fill="#ffd9e6" transform="rotate(38 79 39)"/>
          <g fill="none" stroke-width="3" stroke-linecap="round">
            <path d="M84 30 C96 16, 104 20, 110 8" stroke="#ffb347"/>
            <path d="M74 22 C80 8, 92 10, 96 2" stroke="#22d3ee"/>
          </g>
          <g>
            <rect x="96" y="24" width="7" height="7" rx="1.5" fill="#4ade80" transform="rotate(24 99 27)"/>
            <rect x="82" y="8" width="6" height="6" rx="1.5" fill="#ff2e7e" transform="rotate(-18 85 11)"/>
            <rect x="106" y="42" width="6" height="6" rx="1.5" fill="#ffb347" transform="rotate(32 109 45)"/>
            <circle cx="66" cy="10" r="3" fill="#f8fafc"/>
            <circle cx="104" cy="60" r="3" fill="#22d3ee"/>
          </g>
    </g>
  </defs>
</svg>


<button class="ghost-btn back-btn" id="backBtn" hidden>← В начало</button>

<!-- 1. Подарок. Первый тап нужен и для драматургии, и чтобы браузер разрешил звук -->
<section class="screen screen-gift" id="screenGift">
  <div class="giftbox" id="giftbox" role="button" tabindex="0" aria-label="Открыть подарок">
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
    <svg class="bow" viewBox="0 0 200 112" aria-hidden="true">
      <defs>
        <linearGradient id="bowFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff9dc4"/>
          <stop offset="100%" stop-color="var(--accent)"/>
        </linearGradient>
      </defs>
      <path class="bow-tail" d="M95 54 L70 108 L90 98 L100 62 Z"/>
      <path class="bow-tail" d="M105 54 L130 108 L110 98 L100 62 Z"/>
      <path class="bow-loop" d="M100 50 C66 8, 26 14, 20 40 C14 66, 60 76, 100 54 Z"/>
      <path class="bow-loop" d="M100 50 C134 8, 174 14, 180 40 C186 66, 140 76, 100 54 Z"/>
      <rect class="bow-knot" x="88" y="40" width="24" height="22" rx="6"/>
    </svg>
  </div>
  <p class="eyebrow dim">для</p>
  <h1 class="script-name gradient-text" id="giftTo">Чарос</h1>
  <p class="hint">нажми, чтобы открыть</p>
</section>

<!-- 2. Заставка с фейерверком -->
<section class="screen screen-intro" id="screenIntro" hidden>
  <canvas id="fireworks"></canvas>
  <p class="eyebrow gold">HAPPY BIRTHDAY!</p>
  <h1 class="display-name gradient-text" id="introName">Чарос</h1>
  <button class="btn" id="continueBtn">Дальше <span aria-hidden="true">→</span></button>
</section>

<!-- 3. Слайды -->
<section class="screen screen-deck" id="screenDeck" hidden>
  <div class="dots" id="dots"></div>

  <div class="slides" id="slides">
    <article class="slide is-active" data-slide="card">
      <div class="card-glow" aria-hidden="true"></div>
      <p class="eyebrow pink">HAPPY BIRTHDAY!</p>
      <div class="card-name-row">
        <span class="party"><svg class="popper" viewBox="0 0 120 120" role="img" aria-label="Хлопушка"><use href="#popperArt"/></svg></span>
        <h2 class="script-name gradient-text" id="cardName">Чарос</h2>
        <span class="party right"><svg class="popper" viewBox="0 0 120 120" aria-hidden="true"><use href="#popperArt"/></svg></span>
      </div>
      <p class="card-date" id="cardDate">18 августа</p>
      <p class="card-signoff" id="cardSignoff">С теплом,</p>
      <p class="script-line" id="cardFrom">Фирдавс</p>
      <div class="card-actions">
        <button class="btn" id="unlockBtn"><span aria-hidden="true">🎁</span> Открыть подарок</button>
      </div>
    </article>

    <article class="slide" data-slide="letter">
      <svg class="cake" viewBox="0 0 200 190" role="img" aria-label="Праздничный торт">
        <defs>
          <linearGradient id="ckPlate" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#efe9f2"/><stop offset="1" stop-color="#a49dae"/>
          </linearGradient>
          <linearGradient id="ckBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d2318"/><stop offset="0.3" stop-color="#7d4527"/>
            <stop offset="0.55" stop-color="#9a5c34"/><stop offset="1" stop-color="#382016"/>
          </linearGradient>
          <linearGradient id="ckCream" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e8d3b2"/><stop offset="0.35" stop-color="#fff8ec"/>
            <stop offset="1" stop-color="#dcc4a2"/>
          </linearGradient>
          <linearGradient id="ckCandle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c9285c"/><stop offset="0.4" stop-color="#ff86ae"/>
            <stop offset="1" stop-color="#b81f52"/>
          </linearGradient>
          <radialGradient id="ckFlame" cx="0.5" cy="0.68" r="0.62">
            <stop offset="0" stop-color="#fffbe0"/><stop offset="0.45" stop-color="#ffc23d"/>
            <stop offset="1" stop-color="#ff6a00" stop-opacity="0.15"/>
          </radialGradient>
          <radialGradient id="ckGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <ellipse cx="100" cy="40" rx="52" ry="42" fill="url(#ckGlow)"/>
        <ellipse cx="100" cy="171" rx="74" ry="12" fill="url(#ckPlate)"/>
        <ellipse cx="100" cy="167" rx="66" ry="9" fill="#cfc7d6"/>

        <!-- нижний ярус -->
        <path d="M34 118 h132 v40 a66 12 0 0 1 -132 0 z" fill="url(#ckBody)"/>
        <ellipse cx="100" cy="118" rx="66" ry="12" fill="#a2633a"/>
        <rect x="34" y="106" width="132" height="18" rx="9" fill="url(#ckCream)"/>
        <g fill="url(#ckCream)">
          <circle cx="46" cy="124" r="6"/><circle cx="68" cy="127" r="7"/>
          <circle cx="92" cy="124" r="5"/><circle cx="116" cy="128" r="7"/>
          <circle cx="140" cy="124" r="6"/><circle cx="158" cy="126" r="5"/>
        </g>

        <!-- верхний ярус -->
        <path d="M60 74 h80 v32 a40 10 0 0 1 -80 0 z" fill="url(#ckBody)"/>
        <ellipse cx="100" cy="74" rx="40" ry="10" fill="#a2633a"/>
        <rect x="58" y="63" width="84" height="16" rx="8" fill="url(#ckCream)"/>
        <ellipse cx="100" cy="65" rx="42" ry="9" fill="#fff8ec"/>
        <g fill="url(#ckCream)">
          <circle cx="68" cy="79" r="5"/><circle cx="88" cy="82" r="6"/>
          <circle cx="112" cy="79" r="5"/><circle cx="132" cy="81" r="6"/>
        </g>

        <!-- посыпка -->
        <g opacity="0.95">
          <rect x="72" y="60" width="7" height="3" rx="1.5" fill="#ff2e7e" transform="rotate(-18 75 61)"/>
          <rect x="94" y="57" width="7" height="3" rx="1.5" fill="#ffb347" transform="rotate(12 97 58)"/>
          <rect x="116" y="61" width="7" height="3" rx="1.5" fill="#22d3ee" transform="rotate(-8 119 62)"/>
          <rect x="52" y="110" width="8" height="3" rx="1.5" fill="#ffb347" transform="rotate(14 56 111)"/>
          <rect x="86" y="107" width="8" height="3" rx="1.5" fill="#22d3ee" transform="rotate(-10 90 108)"/>
          <rect x="122" y="110" width="8" height="3" rx="1.5" fill="#ff2e7e" transform="rotate(8 126 111)"/>
        </g>

        <!-- свеча -->
        <rect x="95" y="34" width="10" height="30" rx="5" fill="url(#ckCandle)"/>
        <rect x="95" y="40" width="10" height="4" fill="#fff" opacity="0.75"/>
        <rect x="95" y="52" width="10" height="4" fill="#fff" opacity="0.75"/>
        <path d="M100 30 v6" stroke="#5b4033" stroke-width="2" stroke-linecap="round"/>
        <ellipse class="cake-flame" cx="100" cy="20" rx="7" ry="12" fill="url(#ckFlame)"/>
      </svg>
      <h2 class="letter-title"><span id="letterTitleText"></span><span class="caret" id="caret" aria-hidden="true"></span></h2>
      <div class="letter-body">
        <p class="letter-intro" id="letterIntro"></p>
        <ol class="wishes" id="wishes"></ol>
        <p class="letter-closing" id="letterClosing"></p>
        <p class="letter-sign" id="letterSign"></p>
      </div>
      <p class="skip-hint" id="skipHint">нажми в любом месте, чтобы показать всё сразу</p>
    </article>

    <article class="slide" data-slide="finale">
      <div class="finale-poppers" aria-hidden="true">
        <svg class="popper" viewBox="0 0 120 120"><use href="#popperArt"/></svg>
        <svg class="popper right" viewBox="0 0 120 120"><use href="#popperArt"/></svg>
      </div>
      <h2 class="finale-title" id="finaleTitle">Ещё раз — с днём рождения!</h2>
      <p class="finale-text" id="finaleText">Пусть этот год будет твоим лучшим.</p>
      <button class="btn" id="replayBtn">Посмотреть заново <span aria-hidden="true">✨</span></button>
    </article>
  </div>

  <button class="nav-btn" data-dir="prev" aria-label="Назад">‹</button>
  <button class="nav-btn" data-dir="next" aria-label="Вперёд">›</button>
</section>

<button class="music-toggle" id="musicToggle" aria-label="Музыка">♪</button>
<iframe class="music-frame" id="musicFrame" title="Музыка" allow="autoplay; encrypted-media" hidden></iframe>
<audio id="musicAudio" loop hidden></audio>

<script src="assets/js/shared.js"></script>
<script src="assets/js/card.js"></script>
</body>
</html>
