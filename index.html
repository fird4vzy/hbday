<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения!</title>
<meta name="description" content="Поздравительная открытка с подарком, тортом и списком пожеланий.">
<meta name="theme-color" content="#fff6ec">
<meta property="og:title" content="Тебе открытка 🎁">
<meta property="og:description" content="Открой — это для тебя.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<canvas id="confetti"></canvas>

<!-- Человечки на фоне: четыре фигуры, нарисованные по отдельности -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="dood-base">
      <path class="d-hat" d="M44 58 L70 6 L96 58 Z"/>
      <path class="d-hat-band" d="M53 40 L87 40" />
      <path class="d-hat-band" d="M48 50 L92 50" />
      <path class="d-star" d="M70 0 l3.4 7 7.6 1-5.5 5.4 1.3 7.6L70 17.4 63.2 21l1.3-7.6L59 8l7.6-1z"/>
      <circle class="d-fill" cx="70" cy="90" r="33"/>
      <circle class="d-dot" cx="58" cy="86" r="4"/>
      <circle class="d-dot" cx="82" cy="86" r="4"/>
      <path class="d-line" d="M58 100 q12 11 24 0"/>
      <path class="d-line" d="M70 123 v38"/>
      <path class="d-line" d="M70 161 l-16 27"/>
      <path class="d-line" d="M70 161 l16 27"/>
    </g>

    <symbol id="dood-cake" viewBox="0 0 140 200">
      <use href="#dood-base"/>
      <path class="d-line" d="M70 132 q-20 6 -28 18"/>
      <rect class="d-fill" x="14" y="150" width="44" height="24" rx="5"/>
      <path class="d-line" d="M14 160 q11 8 22 0 q11 8 22 0"/>
      <path class="d-line" d="M36 150 v-12"/>
      <path class="d-flame" d="M36 138 q6 -5 0 -12 q-6 7 0 12z"/>
    </symbol>

    <symbol id="dood-balloon" viewBox="0 0 140 200">
      <use href="#dood-base"/>
      <path class="d-line" d="M70 132 q-22 -2 -30 -16"/>
      <path class="d-line" d="M40 116 q-8 -16 -6 -30"/>
      <ellipse class="d-balloon" cx="32" cy="66" rx="22" ry="26"/>
      <path class="d-line" d="M32 92 l-4 6 8 0 -4 -6z"/>
    </symbol>

    <symbol id="dood-sign" viewBox="0 0 140 200">
      <use href="#dood-base"/>
      <path class="d-line" d="M70 130 q-26 4 -34 16"/>
      <path class="d-line" d="M70 130 q26 4 34 16"/>
      <rect class="d-fill" x="18" y="142" width="104" height="40" rx="6"/>
      <text class="d-text" x="70" y="169" text-anchor="middle">Чарос</text>
    </symbol>

    <symbol id="dood-party" viewBox="0 0 140 200">
      <use href="#dood-base"/>
      <path class="d-line" d="M70 132 q-24 -4 -32 -20"/>
      <path class="d-line" d="M70 132 q24 -4 32 -20"/>
      <g class="d-confetti">
        <rect x="18" y="92" width="8" height="8" rx="2" transform="rotate(20 22 96)"/>
        <rect x="112" y="98" width="8" height="8" rx="2" transform="rotate(-24 116 102)"/>
        <rect x="30" y="60" width="7" height="7" rx="2" transform="rotate(35 33 63)"/>
        <rect x="104" y="66" width="7" height="7" rx="2" transform="rotate(-14 107 69)"/>
        <circle cx="14" cy="120" r="4"/>
        <circle cx="126" cy="126" r="4"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="doodles" aria-hidden="true">
  <svg class="doodle d1" viewBox="0 0 140 200"><use href="#dood-cake"/></svg>
  <svg class="doodle d2" viewBox="0 0 140 200"><use href="#dood-balloon"/></svg>
  <svg class="doodle d3" viewBox="0 0 140 200"><use href="#dood-sign"/></svg>
  <svg class="doodle d4" viewBox="0 0 140 200"><use href="#dood-party"/></svg>
  <svg class="doodle d5" viewBox="0 0 140 200"><use href="#dood-balloon"/></svg>
  <svg class="doodle d6" viewBox="0 0 140 200"><use href="#dood-cake"/></svg>
</div>


<button class="ghost-btn back-btn" id="backBtn" hidden>← В начало</button>

<!-- 1. Подарок. Первый тап нужен и для драматургии, и чтобы браузер разрешил звук -->
<section class="screen screen-gift" id="screenGift">
  <div class="gift-stage" id="giftbox" role="button" tabindex="0" aria-label="Открыть подарок">
    <div class="gift-tilt" id="giftTilt">
      <div class="gift-sway">
        <div class="gift-body">
          <div class="gface gf"></div>
          <div class="gface gb"></div>
          <div class="gface gl"></div>
          <div class="gface gr"></div>
        </div>
        <div class="gift-lid">
          <div class="gface lt"></div>
          <div class="gface lf"></div>
          <div class="gface lb"></div>
          <div class="gface ll"></div>
          <div class="gface lr"></div>
          <svg class="bow" viewBox="0 0 200 112" aria-hidden="true">
            <defs>
              <linearGradient id="bowFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffd86b"/>
                <stop offset="100%" stop-color="var(--warm)"/>
              </linearGradient>
            </defs>
            <path class="bow-tail" d="M95 54 L70 108 L90 98 L100 62 Z"/>
            <path class="bow-tail" d="M105 54 L130 108 L110 98 L100 62 Z"/>
            <path class="bow-loop" d="M100 50 C66 8, 26 14, 20 40 C14 66, 60 76, 100 54 Z"/>
            <path class="bow-loop" d="M100 50 C134 8, 174 14, 180 40 C186 66, 140 76, 100 54 Z"/>
            <rect class="bow-knot" x="88" y="40" width="24" height="22" rx="6"/>
          </svg>
        </div>
        <div class="gift-shadow" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <p class="eyebrow dim">для</p>
  <h1 class="script-name gradient-text" id="giftTo">Чарос</h1>
  <p class="hint">нажми, чтобы открыть</p>
</section>

<!-- 2. Слайды -->
<section class="screen screen-deck" id="screenDeck" hidden>
  <div class="dots" id="dots"></div>

  <div class="slides" id="slides">
    <article class="slide is-active" data-slide="card">
      <div class="card-glow" aria-hidden="true"></div>
      <p class="eyebrow pink">HAPPY BIRTHDAY!</p>
      <div class="card-name-row">
        <span class="party" aria-hidden="true">🎉</span>
        <h2 class="script-name gradient-text" id="cardName">Чарос</h2>
        <span class="party right" aria-hidden="true">🎉</span>
      </div>
      <p class="card-date" id="cardDate">18 августа</p>
      <p class="card-signoff" id="cardSignoff">С теплом,</p>
      <p class="script-line" id="cardFrom">Фирдавс</p>
      <div class="card-actions">
        <button class="btn" id="unlockBtn"><span aria-hidden="true">🎁</span> Открыть подарок</button>
      </div>
    </article>

    <article class="slide" data-slide="letter">
      <div class="cake3d" id="cake3d" role="img" aria-label="Торт с именем — можно покрутить">
        <div class="cake-shadow" aria-hidden="true"></div>
        <div class="cake-orbit" id="cakeOrbit"></div>
      </div>
      <p class="cake-hint" id="cakeHint">покрути торт 👆</p>
      <h2 class="letter-title"><span id="letterTitleText"></span><span class="caret" id="caret" aria-hidden="true"></span></h2>
      <div class="letter-body">
        <p class="letter-intro" id="letterIntro"></p>
        <ol class="wishes" id="wishes"></ol>
        <p class="letter-closing" id="letterClosing"></p>
        <p class="letter-sign" id="letterSign"></p>
      </div>
      <p class="skip-hint" id="skipHint">нажми в любом месте, чтобы показать всё сразу</p>
    </article>

    <article class="slide" data-slide="finale">
      <div class="finale-emoji" aria-hidden="true">🥳</div>
      <h2 class="finale-title" id="finaleTitle">Ещё раз — с днём рождения!</h2>
      <p class="finale-text" id="finaleText">Пусть этот год будет твоим лучшим.</p>
      <button class="btn" id="replayBtn">Посмотреть заново <span aria-hidden="true">✨</span></button>
    </article>
  </div>

  <button class="nav-btn" data-dir="prev" aria-label="Назад">‹</button>
  <button class="nav-btn" data-dir="next" aria-label="Вперёд">›</button>
</section>

<button class="music-toggle" id="musicToggle" aria-label="Музыка">♪</button>
<iframe class="music-frame" id="musicFrame" title="Музыка" allow="autoplay; encrypted-media" hidden></iframe>
<audio id="musicAudio" loop hidden></audio>

<script src="assets/js/shared.js"></script>
<script src="assets/js/card.js"></script>
</body>
</html>
